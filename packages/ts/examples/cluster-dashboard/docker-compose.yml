services:
  certs:
    image: narsil-cluster-dashboard-node:latest
    build:
      context: ../../../..
      dockerfile: packages/ts/examples/cluster-dashboard/Dockerfile.node
    command: ['node', '--import', 'tsx', 'src/scripts/generate-certs.ts']
    environment:
      CERT_DIR: /certs
    volumes:
      - narsil-dashboard-certs:/certs

  etcd:
    image: quay.io/coreos/etcd:v3.5.16
    command:
      - etcd
      - --name=etcd0
      - --data-dir=/etcd-data
      - --listen-client-urls=http://0.0.0.0:2379
      - --advertise-client-urls=http://etcd:2379
    ports:
      - '127.0.0.1:2379:2379'
    healthcheck:
      test: ['CMD', 'etcdctl', 'endpoint', 'health']
      interval: 2s
      timeout: 2s
      retries: 15
    volumes:
      - narsil-dashboard-etcd:/etcd-data

  toxiproxy:
    image: ghcr.io/shopify/toxiproxy:2.12.0
    ports:
      - '127.0.0.1:8474:8474'
    networks:
      default:
        aliases:
          - toxiproxy-node-a
          - toxiproxy-node-b
          - toxiproxy-node-c

  proxy-setup:
    image: narsil-cluster-dashboard-node:latest
    build:
      context: ../../../..
      dockerfile: packages/ts/examples/cluster-dashboard/Dockerfile.node
    command: ['node', '--import', 'tsx', 'src/scripts/setup-proxies.ts']
    environment:
      TOXIPROXY_URL: http://toxiproxy:8474
    depends_on:
      etcd:
        condition: service_healthy
      toxiproxy:
        condition: service_started

  node-a:
    image: narsil-cluster-dashboard-node:latest
    build:
      context: ../../../..
      dockerfile: packages/ts/examples/cluster-dashboard/Dockerfile.node
    environment:
      NODE_ID: node-a
      ETCD_ENDPOINT: http://toxiproxy:4101
      CERT_DIR: /certs
    ports:
      - '127.0.0.1:9701:9701'
    depends_on:
      certs:
        condition: service_completed_successfully
      proxy-setup:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:9701/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 2s
      timeout: 2s
      retries: 30
    volumes:
      - narsil-dashboard-certs:/certs:ro

  node-b:
    image: narsil-cluster-dashboard-node:latest
    build:
      context: ../../../..
      dockerfile: packages/ts/examples/cluster-dashboard/Dockerfile.node
    environment:
      NODE_ID: node-b
      ETCD_ENDPOINT: http://toxiproxy:4102
      CERT_DIR: /certs
    ports:
      - '127.0.0.1:9702:9702'
    depends_on:
      certs:
        condition: service_completed_successfully
      proxy-setup:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:9702/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 2s
      timeout: 2s
      retries: 30
    volumes:
      - narsil-dashboard-certs:/certs:ro

  node-c:
    image: narsil-cluster-dashboard-node:latest
    build:
      context: ../../../..
      dockerfile: packages/ts/examples/cluster-dashboard/Dockerfile.node
    environment:
      NODE_ID: node-c
      ETCD_ENDPOINT: http://toxiproxy:4103
      CERT_DIR: /certs
    ports:
      - '127.0.0.1:9703:9703'
    depends_on:
      certs:
        condition: service_completed_successfully
      proxy-setup:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:9703/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 2s
      timeout: 2s
      retries: 30
    volumes:
      - narsil-dashboard-certs:/certs:ro

volumes:
  narsil-dashboard-certs:
  narsil-dashboard-etcd:
