services:
  etcd:
    image: quay.io/coreos/etcd:v3.5.16
    command:
      - etcd
      - --name=etcd0
      - --data-dir=/etcd-data
      - --listen-client-urls=http://0.0.0.0:2379
      - --advertise-client-urls=http://127.0.0.1:2379
    ports:
      - '127.0.0.1:2379:2379'
    healthcheck:
      test: ['CMD', 'etcdctl', 'endpoint', 'health']
      interval: 2s
      timeout: 2s
      retries: 15
