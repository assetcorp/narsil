[package]
name = "delali-narsil-cluster"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Join a Rust process to a Narsil cluster, with the TCP and gRPC node transports that TypeScript nodes speak."
license = "Apache-2.0"
repository = "https://github.com/assetcorp/narsil"
homepage = "https://narsil.sondelali.com"
readme = "README.md"
keywords = ["search", "cluster", "grpc", "bm25", "hnsw"]
categories = ["database-implementations", "network-programming"]

[lib]
name = "narsil_cluster"
path = "src/lib.rs"

[dependencies]
bytes = "=1.12.1"
crc32fast = "=1.5.4"
delali-narsil = { path = "../rust", version = "0.2.3" }
etcd-client = { version = "=0.21.1", features = ["tls"] }
futures-core = "=0.3.34"
getrandom = "=0.4.3"
http = "=1.5.0"
http-body = "=1.1.0"
hyper = { version = "=1.12.0", features = ["http2", "client", "server"] }
hyper-util = { version = "=0.1.21", features = ["tokio", "service", "server", "http2"] }
jiff = "=0.2.38"
prost = "=0.14.6"
rustls-pki-types = { version = "=1.16.0", features = ["std"] }
sha2 = "=0.11.1"
tokio = { version = "=1.54.1", features = ["rt-multi-thread", "net", "sync", "time", "macros", "io-util", "fs"] }
tokio-rustls = { version = "=0.26.6", default-features = false, features = ["ring", "logging", "tls12"] }
tonic = { version = "=0.14.9", default-features = false }
tonic-prost = "=0.14.9"
tower-service = "=0.3.3"

[profile.dev]
opt-level = 1

[profile.release]
codegen-units = 1
lto = "thin"

[dev-dependencies]
http-body-util = "=0.1.5"
rcgen = "=0.14.10"
tokio = { version = "=1.54.1", features = ["signal", "rt-multi-thread", "macros", "process"] }
