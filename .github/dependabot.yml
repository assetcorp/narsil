version: 2

multi-ecosystem-groups:
  all-dependencies:
    schedule:
      interval: "monthly"
    commit-message:
      prefix: "deps"

updates:
  - package-ecosystem: "npm"
    directory: "/"
    exclude-paths:
      - "benchmarks/**"
      - "packages/react-native/**"
      - "packages/spec/**"
      - "packages/ts/examples/**"
    multi-ecosystem-group: "all-dependencies"
    patterns: ["*"]
    cooldown:
      default-days: 4
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "pip"
    directory: "/packages/python"
    multi-ecosystem-group: "all-dependencies"
    patterns: ["*"]
    cooldown:
      default-days: 4
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "pip"
    directory: "/packages/python-engine"
    multi-ecosystem-group: "all-dependencies"
    patterns: ["*"]
    cooldown:
      default-days: 4
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "gomod"
    directory: "/packages/go"
    multi-ecosystem-group: "all-dependencies"
    patterns: ["*"]
    cooldown:
      default-days: 4
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "github-actions"
    directory: "/"
    multi-ecosystem-group: "all-dependencies"
    patterns: ["*"]
    cooldown:
      default-days: 4
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
