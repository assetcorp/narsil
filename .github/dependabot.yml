version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/packages/ts"
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 4
    groups:
      production:
        dependency-type: "production"
      dev-dependencies:
        dependency-type: "development"
    commit-message:
      prefix: "deps"
      prefix-development: "deps(dev)"

  - package-ecosystem: "pip"
    directory: "/packages/python"
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 4
    commit-message:
      prefix: "deps"

  - package-ecosystem: "gomod"
    directory: "/packages/go"
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 4
    commit-message:
      prefix: "deps"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 4
    commit-message:
      prefix: "ci"
