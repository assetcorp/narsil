name: Generated Stemmers

on:
  push:
    branches: [main]
    paths:
      - 'packages/ts/src/languages/snowball/**'
      - 'packages/ts/snowball/**'
  pull_request:
    branches: [main]
    paths:
      - 'packages/ts/src/languages/snowball/**'
      - 'packages/ts/snowball/**'

permissions:
  contents: read

concurrency:
  group: generated-stemmers-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generated-stemmer-check:
    name: Generated Stemmer Check
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Regenerate every stemmer and check it against the published pairs
        run: pnpm nx run narsil-ts:stemmers
        timeout-minutes: 15

      - name: Check the committed stemmers match what the generator produces
        run: |
          if ! git diff --exit-code -- packages/ts/src/languages/snowball; then
            echo "::error::A committed stemmer differs from generator output. Run 'pnpm nx run narsil-ts:stemmers' and commit the result."
            exit 1
          fi
