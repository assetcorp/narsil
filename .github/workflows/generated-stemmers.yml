name: Generated Stemmers

on:
  push:
    branches: [main]
    paths:
      - 'packages/ts/src/languages/snowball/**'
      - 'packages/ts/snowball/**'
  pull_request:
    branches: [main]
    paths:
      - 'packages/ts/src/languages/snowball/**'
      - 'packages/ts/snowball/**'

permissions:
  contents: read

concurrency:
  group: generated-stemmers-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generated-stemmer-check:
    name: Generated Stemmer Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Regenerate every stemmer and check it against the published pairs
        run: pnpm nx run narsil-ts:stemmers
        timeout-minutes: 15

      - name: Check the committed stemmers match what the generator produces
        run: |
          if ! git diff --exit-code -- packages/ts/src/languages/snowball; then
            echo "::error::A committed stemmer differs from generator output. Run 'pnpm nx run narsil-ts:stemmers' and commit the result."
            exit 1
          fi
