name: Cluster fault campaign

on:
  schedule:
    - cron: '43 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cluster-fault-campaign-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  campaign:
    name: Replay every seed of faults that once failed, then try new seeds on the TCP and gRPC carriers
    runs-on: ubuntu-24.04
    timeout-minutes: 44
    permissions:
      contents: read
      issues: write

    steps:
      - name: Reserve four minutes for saving the campaign evidence
        run: echo "NARSIL_FAULT_DEADLINE=$(( $(date +%s%3N) + 40 * 60000 ))" >> "$GITHUB_ENV"

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build the code that the cluster nodes load
        run: pnpm nx run narsil-ts:build

      - name: Restore the seeds that earlier campaigns saw fail
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: packages/ts/fault-campaign/failing-seeds
          key: cluster-fault-seeds-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: cluster-fault-seeds-

      - name: Replay saved seeds before trying new seeds
        working-directory: packages/ts
        run: node scripts/fault-campaign.mjs --minutes 30 --deadline "$NARSIL_FAULT_DEADLINE"

      - name: Save the seeds that still fail
        if: always()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: packages/ts/fault-campaign/failing-seeds
          key: cluster-fault-seeds-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Upload the failing seeds and their logs
        id: upload
        if: ${{ failure() || cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: narsil-cluster-fault-failures
          path: |
            packages/ts/fault-campaign/failing-seeds
            packages/ts/fault-campaign/logs
          if-no-files-found: ignore

      - name: Open, update, or close an issue for each seed that failed or retired
        if: ${{ !cancelled() }}
        working-directory: packages/ts
        env:
          GH_TOKEN: ${{ github.token }}
          NARSIL_FAULT_ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
        run: node scripts/fault-campaign-issues.mjs
