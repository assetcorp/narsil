          DRY_RUN_FLAG: ${{ inputs.dry-run && '--dry-run' || '' }}
          GITHUB_TOKEN: ${{ secrets.RELEASE_PAT }}
        run: pnpm nx release "$VERSION" $DRY_RUN_FLAG --projects=narsil-python --skip-publish

      - name: Build the package
        working-directory: packages/python
        run: python3 scripts/tools.py python -m build --no-isolation --outdir dist .

      - name: Publish to PyPI through trusted publishing
        if: ${{ !inputs.dry-run }}
