name: Publish dataset artifact

on:
  workflow_dispatch:
    inputs:
      dataset:
        description: Dataset id from benchmarks/server/config/benchmark.toml, or the conformance suite's dataset
        type: choice
        required: true
        options:
          - beir/scifact/test
          - beir/nfcorpus/test
          - dbpedia-entities-openai-100k
          - dbpedia-entities-openai-1m
          - conformance/billsum-us
      notes_only:
        description: Rewrite the release title and notes from the published manifest and upload nothing
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: publish-dataset-${{ inputs.dataset }}

jobs:
  publish:
    name: Publish ${{ inputs.dataset }}
    runs-on: ubuntu-latest
    timeout-minutes: 300
    defaults:
      run:
        working-directory: benchmarks/server
    env:
      GH_TOKEN: ${{ github.token }}
      DATASET: ${{ inputs.dataset }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Refuse a notes rewrite for the conformance dataset
        if: ${{ inputs.notes_only && inputs.dataset == 'conformance/billsum-us' }}
        run: |
          echo "::error::the conformance dataset writes its notes while it publishes, so run the workflow without notes_only"
          exit 1

      - name: Install the harness with the parquet reader
        if: ${{ inputs.dataset != 'conformance/billsum-us' }}
        run: python3 -m pip install -e '.[artifacts]'

      - name: Free the disk held by preinstalled toolchains
        if: ${{ !inputs.notes_only }}
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup
          df -h /

      - name: Build the artifact from its source
        if: ${{ !inputs.notes_only && inputs.dataset != 'conformance/billsum-us' }}
        run: python3 -m ir_bench.publish_dataset build --dataset-id "$DATASET"

      - name: Stage the release files and write the notes
        if: ${{ !inputs.notes_only && inputs.dataset != 'conformance/billsum-us' }}
        id: stage
        run: python3 -m ir_bench.publish_dataset stage --dataset-id "$DATASET"

      - name: Setup pnpm
        if: ${{ !inputs.notes_only && inputs.dataset == 'conformance/billsum-us' }}
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Setup Node.js
        if: ${{ !inputs.notes_only && inputs.dataset == 'conformance/billsum-us' }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies for the conformance suite
        if: ${{ !inputs.notes_only && inputs.dataset == 'conformance/billsum-us' }}
        working-directory: .
        run: pnpm install --frozen-lockfile

      - name: Build the embedding adapter
        if: ${{ !inputs.notes_only && inputs.dataset == 'conformance/billsum-us' }}
        working-directory: .
        run: pnpm nx run narsil-embeddings-transformers:build

      - name: Build the conformance dataset from its source
        if: ${{ !inputs.notes_only && inputs.dataset == 'conformance/billsum-us' }}
        working-directory: packages/conformance
        run: pnpm run dataset:build "$RUNNER_TEMP/conformance-artifact"

      - name: Stage the conformance release files and write the notes
        if: ${{ !inputs.notes_only && inputs.dataset == 'conformance/billsum-us' }}
        id: stage_conformance
        working-directory: packages/conformance
        run: pnpm run dataset:stage "$RUNNER_TEMP/conformance-artifact" "$RUNNER_TEMP/conformance-stage"

      - name: Create the release or replace its files
        if: ${{ !inputs.notes_only }}
        env:
          TAG: ${{ steps.stage.outputs.tag || steps.stage_conformance.outputs.tag }}
          TITLE: ${{ steps.stage.outputs.title || steps.stage_conformance.outputs.title }}
          STAGE: ${{ steps.stage.outputs.stage || steps.stage_conformance.outputs.stage }}
          NOTES: ${{ steps.stage.outputs.notes || steps.stage_conformance.outputs.notes }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' > existing-assets.txt 2>/dev/null; then
            while read -r asset; do
              if [ -n "$asset" ] && [ ! -e "$STAGE/$asset" ]; then
                gh release delete-asset "$TAG" "$asset" --repo "$GITHUB_REPOSITORY" --yes
              fi
            done < existing-assets.txt
            gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber "$STAGE"/*
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --title "$TITLE" --notes-file "$NOTES"
          else
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --prerelease --latest=false --title "$TITLE" --notes-file "$NOTES" "$STAGE"/*
          fi

      - name: Compare the digest with the config pin
        if: ${{ !inputs.notes_only && inputs.dataset != 'conformance/billsum-us' }}
        env:
          DIGEST: ${{ steps.stage.outputs.digest }}
          PINNED: ${{ steps.stage.outputs.pinned }}
        run: |
          if [ "$DIGEST" = "$PINNED" ]; then
            echo "::notice::artifact_sha256 for $DATASET already equals $DIGEST"
          else
            echo "::warning::set artifact_sha256 = \"$DIGEST\" for $DATASET in benchmarks/server/config/benchmark.toml; the config holds $PINNED"
          fi

      - name: Compare the digest with the conformance pin
        if: ${{ !inputs.notes_only && inputs.dataset == 'conformance/billsum-us' }}
        env:
          DIGEST: ${{ steps.stage_conformance.outputs.digest }}
          PINNED: ${{ steps.stage_conformance.outputs.pinned }}
        run: |
          if [ "$DIGEST" = "$PINNED" ]; then
            echo "::notice::the conformance pin already equals $DIGEST"
          else
            echo "::warning::set sha256 to \"$DIGEST\" in packages/conformance/dataset-pin.json; the pin holds \"$PINNED\""
          fi

      - name: Write the notes from the published manifest
        if: ${{ inputs.notes_only }}
        id: notes
        run: python3 -m ir_bench.publish_dataset notes --dataset-id "$DATASET"

      - name: Update the release title and notes
        if: ${{ inputs.notes_only }}
        env:
          TAG: ${{ steps.notes.outputs.tag }}
          TITLE: ${{ steps.notes.outputs.title }}
          NOTES: ${{ steps.notes.outputs.notes }}
        run: gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --title "$TITLE" --notes-file "$NOTES"
