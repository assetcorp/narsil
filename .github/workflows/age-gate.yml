name: Dependency Age Gate

on:
  pull_request:

permissions:
  contents: read

jobs:
  check-age:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'

      - name: Run age gate
        run: |
          for script in check-age.js age-gate-cargo.js; do
            if ! git show "${BASE_SHA}:.github/scripts/${script}" > "$RUNNER_TEMP/${script}" 2>/dev/null; then
              cp ".github/scripts/${script}" "$RUNNER_TEMP/${script}"
            fi
          done

          node "$RUNNER_TEMP/check-age.js"
        env:
          MIN_AGE_DAYS: 4
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
