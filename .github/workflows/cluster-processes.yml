name: Cluster Node Processes

on:
  push:
    branches: [main]
    paths:
      - 'packages/ts/src/distribution/**'
      - 'packages/ts/src/runtime/**'
      - 'packages/ts/src/server/**'
      - 'packages/ts/src/__tests__/e2e/cluster-memory/**'
      - '.github/workflows/cluster-processes.yml'
  pull_request:
    branches: [main]
    paths:
      - 'packages/ts/src/distribution/**'
      - 'packages/ts/src/runtime/**'
      - 'packages/ts/src/server/**'
      - 'packages/ts/src/__tests__/e2e/cluster-memory/**'
      - '.github/workflows/cluster-processes.yml'

permissions:
  contents: read

concurrency:
  group: cluster-processes-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cluster-process-tests:
    name: Cluster Node Process Tests
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      etcd:
        image: gcr.io/etcd-development/etcd:v3.6.0
        entrypoint: /usr/local/bin/etcd
        command: >-
          --name node1
          --data-dir /etcd-data
          --listen-client-urls http://0.0.0.0:2379
          --advertise-client-urls http://127.0.0.1:2379
          --listen-peer-urls http://0.0.0.0:2380
          --initial-advertise-peer-urls http://127.0.0.1:2380
          --initial-cluster node1=http://127.0.0.1:2380
        ports:
          - 2379:2379

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm nx run narsil-ts:build

      - name: Run cluster node process tests
        env:
          NARSIL_ETCD_ENDPOINT: http://127.0.0.1:2379
        run: pnpm nx run narsil-ts:test:cluster
        timeout-minutes: 30
