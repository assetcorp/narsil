name: Publish the Rust crate

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'The version to publish, which must equal the version in packages/rust/Cargo.toml'
        required: true
        type: string
      dry-run:
        description: 'Package and verify the crate without publishing it'
        required: false
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: publish-rust
  cancel-in-progress: false

jobs:
  checks:
    name: Rust crate checks
    uses: ./.github/workflows/rust.yml

  publish:
    name: Publish delali-narsil to crates.io
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: crates-io
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install the pinned Rust toolchain
        working-directory: packages/rust
        run: rustup toolchain install

      - name: Check that the requested version is the crate's version
        working-directory: packages/rust
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          crate_version="$(cargo metadata --no-deps --format-version 1 --locked | node -e 'let text = ""; process.stdin.on("data", chunk => { text += chunk }); process.stdin.on("end", () => { process.stdout.write(JSON.parse(text).packages.find(entry => entry.name === "delali-narsil").version) })')"
          if [ "$crate_version" != "$REQUESTED_VERSION" ]; then
            echo "packages/rust/Cargo.toml holds version $crate_version, not $REQUESTED_VERSION" >&2
            exit 1
          fi

      - name: Copy the C sources of the core into the crate
        run: |
          rm -rf packages/rust/core
          mkdir -p packages/rust/core
          cp -R packages/native/include packages/rust/core/include
          cp -R packages/native/src packages/rust/core/src

      - name: Package the crate and build it from the package alone
        working-directory: packages/rust
        run: cargo package --locked --allow-dirty

      - name: Sign in to crates.io with a short-lived token
        if: ${{ !inputs.dry-run }}
        id: auth
        uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6

      - name: Publish
        if: ${{ !inputs.dry-run }}
        working-directory: packages/rust
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo publish --locked --allow-dirty
