name: Performance comment

on:
  workflow_run:
    workflows: [Performance]
    types: [completed]

permissions: {}

jobs:
  quality-checks:
    name: Comment on quality checks
    if: github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
      pull-requests: write

    steps:
      - name: Checkout the comment script from the default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts

      - name: Download every quality check report
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          mkdir -p "$RUNNER_TEMP/quality-checks"
          gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" --pattern 'quality-check-*' --dir "$RUNNER_TEMP/quality-checks" \
            || echo "The run uploaded no quality check report."

      - name: Post or update the comment
        env:
          GITHUB_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          REPORT_DIR: ${{ runner.temp }}/quality-checks
        run: node .github/scripts/comment-quality-checks.js
