name: Go engine

on:
  push:
    branches: [main]
    paths:
      - 'packages/go/engine/**'
      - 'packages/native/include/**'
      - 'packages/native/src/**'
      - 'packages/conformance/**'
      - 'packages/spec/**'
      - 'packages/ts/src/**'
      - '.github/workflows/go-engine.yml'
  pull_request:
    branches: [main]
    paths:
      - 'packages/go/engine/**'
      - 'packages/native/include/**'
      - 'packages/native/src/**'
      - 'packages/conformance/**'
      - 'packages/spec/**'
      - 'packages/ts/src/**'
      - '.github/workflows/go-engine.yml'
  workflow_call:

permissions:
  contents: read

concurrency:
  group: go-engine-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Core copy, gofmt, and go vet
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: packages/go/engine/go.mod
          cache: false

      - name: The copied C core matches packages/native
        working-directory: packages/go/engine
        run: go run ./internal/corecopy

      - name: gofmt
        working-directory: packages/go/engine
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }

      - name: go vet
        working-directory: packages/go/engine
        run: go vet ./...

  engine-build:
    name: Build the TypeScript engine for the cross-implementation tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build the engine
        run: pnpm nx run narsil-ts:build:code

      - name: Upload the build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: narsil-ts-dist
          path: packages/ts/dist
          if-no-files-found: error

  test:
    name: Test on ${{ matrix.platform }} with Go ${{ matrix.go }}
    needs: engine-build
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x64
            runner: ubuntu-latest
            go: '1.26'
            race: true
          - platform: linux-x64
            runner: ubuntu-latest
            go: stable
            race: true
          - platform: linux-arm64
            runner: ubuntu-24.04-arm
            go: stable
            race: true
          - platform: darwin-arm64
            runner: macos-15
            go: stable
            race: true
          - platform: darwin-x64
            runner: macos-15-intel
            go: stable
            race: true
          - platform: win32-x64
            runner: windows-latest
            go: stable
            race: true
          - platform: win32-arm64
            runner: windows-11-arm
            go: stable
            race: false
            zig-target: aarch64-windows-gnu

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Download the TypeScript engine
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: narsil-ts-dist
          path: packages/ts/dist

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go }}
          cache: false

      - name: Setup Zig
        if: matrix.zig-target
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.16.0

      - name: Use Zig as the C compiler
        if: matrix.zig-target
        run: echo "CC=zig cc -target ${{ matrix.zig-target }}" >> "$GITHUB_ENV"

      - name: Test with the race detector
        if: matrix.race
        working-directory: packages/go/engine
        env:
          CGO_ENABLED: '1'
        run: go test -count=1 -race ./...

      - name: Test on a platform without the race detector
        if: ${{ !matrix.race }}
        working-directory: packages/go/engine
        env:
          CGO_ENABLED: '1'
        run: go test -count=1 ./...
