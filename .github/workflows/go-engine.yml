name: Go engine

on:
  push:
    branches: [main]
    paths:
      - 'packages/go/engine/**'
      - 'packages/native/include/**'
      - 'packages/native/src/**'
      - 'packages/conformance/**'
      - 'packages/spec/**'
      - 'packages/ts/src/**'
      - '.github/workflows/go-engine.yml'
      - '!**/*.md'
      - '!packages/ts/src/__tests__/**'
      - '!packages/ts/src/client/**'
      - '!packages/ts/src/react/**'
      - '!packages/ts/src/http-retry/**'
      - '!packages/ts/src/rerankers/**'
      - '!packages/ts/src/embeddings/**'
      - '!packages/ts/src/invalidation/**'
  pull_request:
    branches: [main]
    paths:
      - 'packages/go/engine/**'
      - 'packages/native/include/**'
      - 'packages/native/src/**'
      - 'packages/conformance/**'
      - 'packages/spec/**'
      - 'packages/ts/src/**'
      - '.github/workflows/go-engine.yml'
      - '!**/*.md'
      - '!packages/ts/src/__tests__/**'
      - '!packages/ts/src/client/**'
      - '!packages/ts/src/react/**'
      - '!packages/ts/src/http-retry/**'
      - '!packages/ts/src/rerankers/**'
      - '!packages/ts/src/embeddings/**'
      - '!packages/ts/src/invalidation/**'
  workflow_call:

permissions:
  contents: read

concurrency:
  group: go-engine-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Core copy, gofmt, and go vet
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: packages/go/engine/go.mod
          cache: false

      - name: The copied C core matches packages/native
        working-directory: packages/go/engine
        run: go run ./internal/corecopy

      - name: gofmt
        working-directory: packages/go/engine
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }

      - name: go vet
        working-directory: packages/go/engine
        run: go vet ./...

  engine-build:
    name: Build the TypeScript engine for the cross-implementation tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build the engine
        run: pnpm nx run narsil-ts:build:code

      - name: Upload the build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: narsil-ts-dist
          path: packages/ts/dist
          if-no-files-found: error

  test:
    name: Test on ${{ matrix.target.platform }} with Go ${{ matrix.target.go }}, part ${{ matrix.shard }} of 4
    needs: engine-build
    runs-on: ${{ matrix.target.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
        target:
          - platform: linux-x64
            runner: ubuntu-latest
            go: '1.26'
            race: true
          - platform: linux-x64
            runner: ubuntu-latest
            go: stable
            race: true
          - platform: linux-arm64
            runner: ubuntu-24.04-arm
            go: stable
            race: true
          - platform: darwin-arm64
            runner: macos-15
            go: stable
            race: true
          - platform: darwin-x64
            runner: macos-15-intel
            go: stable
            race: false
          - platform: win32-x64
            runner: windows-latest
            go: stable
            race: true
          - platform: win32-arm64
            runner: windows-11-arm
            go: stable
            race: false
            llvm-mingw-release: '20261104'
            llvm-mingw-archive: llvm-mingw-20261104-ucrt-aarch64
            llvm-mingw-sha256: 7d7f8387a8706639b0b47a629d6e23f8b3ef9acce67e9832b8cd4c5bb2816eab
            llvm-mingw-cc: aarch64-w64-mingw32-clang

    env:
      PART_1_TESTS: TestConcurrentWritesRestartsAndRestoresKeepEverySearchExact
      PART_2_TESTS: TestEveryAcknowledgedVectorFindsItselfWhileGrowthPassesPlaceNewOnes|TestVectorsFindThemselvesAfterAStopFollowingACheckpointTakenWhileTheGraphGrew|TestCrossImplementationSavesOpenWithTheSameAnswers
      PART_3_TESTS: TestSearchesDuringLargeWriteBatchesMatchTheCommittedTally|TestTextStoredOnDiskLeavesNoCheckpointedTextInMemory|TestCrashKeepsEveryAcknowledgedWrite

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Install the TypeScript engine's runtime dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts --prod --filter @delali/narsil

      - name: Download the TypeScript engine
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: narsil-ts-dist
          path: packages/ts/dist

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.target.go }}
          cache: false

      - name: Use llvm-mingw as the C compiler
        if: matrix.target.llvm-mingw-archive
        shell: pwsh
        env:
          LLVM_MINGW_RELEASE: ${{ matrix.target.llvm-mingw-release }}
          LLVM_MINGW_ARCHIVE: ${{ matrix.target.llvm-mingw-archive }}
          LLVM_MINGW_SHA256: ${{ matrix.target.llvm-mingw-sha256 }}
          LLVM_MINGW_CC: ${{ matrix.target.llvm-mingw-cc }}
        run: |
          $archive = Join-Path $env:RUNNER_TEMP "$env:LLVM_MINGW_ARCHIVE.zip"
          Invoke-WebRequest -Uri "https://github.com/mstorsjo/llvm-mingw/releases/download/$env:LLVM_MINGW_RELEASE/$env:LLVM_MINGW_ARCHIVE.zip" -OutFile $archive -MaximumRetryCount 5 -RetryIntervalSec 5
          $digest = (Get-FileHash -Algorithm SHA256 -LiteralPath $archive).Hash.ToLowerInvariant()
          if ($digest -ne $env:LLVM_MINGW_SHA256) { throw "The llvm-mingw archive has the digest $digest, while the workflow pins $env:LLVM_MINGW_SHA256" }
          & (Join-Path $env:SystemRoot 'System32\tar.exe') -xf $archive -C $env:RUNNER_TEMP
          if ($LASTEXITCODE -ne 0) { throw "tar could not extract the llvm-mingw archive" }
          Join-Path $env:RUNNER_TEMP "$env:LLVM_MINGW_ARCHIVE\bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          "CC=$env:LLVM_MINGW_CC" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          & (Join-Path $env:RUNNER_TEMP "$env:LLVM_MINGW_ARCHIVE\bin\$env:LLVM_MINGW_CC.exe") --version

      - name: Test part ${{ matrix.shard }} of 4
        working-directory: packages/go/engine
        env:
          CGO_ENABLED: '1'
          PART: ${{ matrix.shard }}
          RACE_FLAG: ${{ matrix.target.race && '-race' || '' }}
        run: |
          case "$PART" in
            1) selection=(-run "^(${PART_1_TESTS})\$") ;;
            2) selection=(-run "^(${PART_2_TESTS})\$") ;;
            3) selection=(-run "^(${PART_3_TESTS})\$") ;;
            *) selection=(-skip "^(${PART_1_TESTS}|${PART_2_TESTS}|${PART_3_TESTS})\$") ;;
          esac
          go test -count=1 $RACE_FLAG -timeout 8m "${selection[@]}" ./...
