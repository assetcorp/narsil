name: Go engine

on:
  workflow_call:
    inputs:
      proven-on-main:
        description: 'Main has passed the push checks of the Go engine on the same inputs, so a release tests only the platforms that main never tests'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  checks:
    name: Core copy, gofmt, and go vet
    if: ${{ !inputs.proven-on-main }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: packages/go/engine/go.mod
          cache: false

      - name: The copied C core matches packages/native
        working-directory: packages/go/engine
        run: go run ./internal/corecopy

      - name: gofmt
        working-directory: packages/go/engine
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }

      - name: go vet
        working-directory: packages/go/engine
        run: go vet ./...

      - name: Compile and run the README example
        working-directory: packages/go/engine
        run: node ../../../.github/scripts/check-readme-examples.js go README.md

  test:
    name: Test on ${{ matrix.target.platform }} with Go ${{ matrix.target.go }}, part ${{ matrix.shard }} of ${{ matrix.parts }}
    runs-on: ${{ matrix.target.runner }}
    timeout-minutes: ${{ matrix.parts == 1 && 40 || 20 }}
    strategy:
      fail-fast: false
      max-parallel: 18
      matrix: >-
        ${{ fromJSON((github.event_name == 'pull_request' || github.event_name == 'push') && '{"include": [
        {"parts": 2, "shard": 1, "target": {"platform": "linux-x64", "runner": "ubuntu-latest", "go": "1.26", "race": true}},
        {"parts": 2, "shard": 2, "target": {"platform": "linux-x64", "runner": "ubuntu-latest", "go": "1.26", "race": true}},
        {"parts": 2, "shard": 1, "target": {"platform": "linux-x64", "runner": "ubuntu-latest", "go": "stable", "race": true}},
        {"parts": 2, "shard": 2, "target": {"platform": "linux-x64", "runner": "ubuntu-latest", "go": "stable", "race": true}},
        {"parts": 2, "shard": 1, "target": {"platform": "darwin-arm64", "runner": "macos-15", "go": "stable", "race": true}},
        {"parts": 2, "shard": 2, "target": {"platform": "darwin-arm64", "runner": "macos-15", "go": "stable", "race": true}},
        {"parts": 5, "shard": 1, "target": {"platform": "win32-x64", "runner": "windows-latest", "go": "stable", "race": true}},
        {"parts": 5, "shard": 2, "target": {"platform": "win32-x64", "runner": "windows-latest", "go": "stable", "race": true}},
        {"parts": 5, "shard": 3, "target": {"platform": "win32-x64", "runner": "windows-latest", "go": "stable", "race": true}},
        {"parts": 5, "shard": 4, "target": {"platform": "win32-x64", "runner": "windows-latest", "go": "stable", "race": true}},
        {"parts": 5, "shard": 5, "target": {"platform": "win32-x64", "runner": "windows-latest", "go": "stable", "race": true}}
        ]}' || inputs.proven-on-main && '{"include": [
        {"parts": 2, "shard": 1, "target": {"platform": "linux-arm64", "runner": "ubuntu-24.04-arm", "go": "stable", "race": true}},
        {"parts": 2, "shard": 2, "target": {"platform": "linux-arm64", "runner": "ubuntu-24.04-arm", "go": "stable", "race": true}},
        {"parts": 4, "shard": 1, "target": {"platform": "darwin-x64", "runner": "macos-15-intel", "go": "stable", "race": false}},
        {"parts": 4, "shard": 2, "target": {"platform": "darwin-x64", "runner": "macos-15-intel", "go": "stable", "race": false}},
        {"parts": 4, "shard": 3, "target": {"platform": "darwin-x64", "runner": "macos-15-intel", "go": "stable", "race": false}},
        {"parts": 4, "shard": 4, "target": {"platform": "darwin-x64", "runner": "macos-15-intel", "go": "stable", "race": false}},
        {"parts": 4, "shard": 1, "target": {"platform": "win32-arm64", "runner": "windows-11-arm", "go": "stable", "race": false}},
        {"parts": 4, "shard": 2, "target": {"platform": "win32-arm64", "runner": "windows-11-arm", "go": "stable", "race": false}},
        {"parts": 4, "shard": 3, "target": {"platform": "win32-arm64", "runner": "windows-11-arm", "go": "stable", "race": false}},
        {"parts": 4, "shard": 4, "target": {"platform": "win32-arm64", "runner": "windows-11-arm", "go": "stable", "race": false}}
        ]}' || '{"include": [
        {"parts": 2, "shard": 1, "target": {"platform": "linux-x64", "runner": "ubuntu-latest", "go": "1.26", "race": true}},
        {"parts": 2, "shard": 2, "target": {"platform": "linux-x64", "runner": "ubuntu-latest", "go": "1.26", "race": true}},
        {"parts": 2, "shard": 1, "target": {"platform": "linux-x64", "runner": "ubuntu-latest", "go": "stable", "race": true}},
        {"parts": 2, "shard": 2, "target": {"platform": "linux-x64", "runner": "ubuntu-latest", "go": "stable", "race": true}},
        {"parts": 2, "shard": 1, "target": {"platform": "darwin-arm64", "runner": "macos-15", "go": "stable", "race": true}},
        {"parts": 2, "shard": 2, "target": {"platform": "darwin-arm64", "runner": "macos-15", "go": "stable", "race": true}},
        {"parts": 5, "shard": 1, "target": {"platform": "win32-x64", "runner": "windows-latest", "go": "stable", "race": true}},
        {"parts": 5, "shard": 2, "target": {"platform": "win32-x64", "runner": "windows-latest", "go": "stable", "race": true}},
        {"parts": 5, "shard": 3, "target": {"platform": "win32-x64", "runner": "windows-latest", "go": "stable", "race": true}},
        {"parts": 5, "shard": 4, "target": {"platform": "win32-x64", "runner": "windows-latest", "go": "stable", "race": true}},
        {"parts": 5, "shard": 5, "target": {"platform": "win32-x64", "runner": "windows-latest", "go": "stable", "race": true}},
        {"parts": 2, "shard": 1, "target": {"platform": "linux-arm64", "runner": "ubuntu-24.04-arm", "go": "stable", "race": true}},
        {"parts": 2, "shard": 2, "target": {"platform": "linux-arm64", "runner": "ubuntu-24.04-arm", "go": "stable", "race": true}},
        {"parts": 2, "shard": 1, "target": {"platform": "darwin-x64", "runner": "macos-15-intel", "go": "stable", "race": false}},
        {"parts": 2, "shard": 2, "target": {"platform": "darwin-x64", "runner": "macos-15-intel", "go": "stable", "race": false}},
        {"parts": 4, "shard": 1, "target": {"platform": "win32-arm64", "runner": "windows-11-arm", "go": "stable", "race": false}},
        {"parts": 4, "shard": 2, "target": {"platform": "win32-arm64", "runner": "windows-11-arm", "go": "stable", "race": false}},
        {"parts": 4, "shard": 3, "target": {"platform": "win32-arm64", "runner": "windows-11-arm", "go": "stable", "race": false}},
        {"parts": 4, "shard": 4, "target": {"platform": "win32-arm64", "runner": "windows-11-arm", "go": "stable", "race": false}}
        ]}') }}

    env:
      PART_1_TESTS: TestConcurrentWritesRestartsAndRestoresKeepEverySearchExact
      PART_2_TESTS: TestEveryAcknowledgedVectorFindsItselfWhileGrowthPassesPlaceNewOnes|TestCrossImplementationSavesOpenWithTheSameAnswers
      PART_3_TESTS: TestSearchesDuringLargeWriteBatchesMatchTheCommittedTally|TestTextStoredOnDiskLeavesNoCheckpointedTextInMemory|TestCrashKeepsEveryAcknowledgedWrite
      PART_5_TESTS: TestVectorsFindThemselvesAfterAStopFollowingACheckpointTakenWhileTheGraphGrew
      PROMOTION_TEST: TestEmbeddingsUpdatedWhileTheVectorFieldPromotesReachSnapshotsAndRestarts
      GRAPH_WRITES_TEST: TestVectorSearchesAgreeWithTheirVectorsWhileTheGraphPlacesWrites
      SYNCED_WRITE_TESTS: TestHeldDocumentsOutliveLaterWritesCompactionAndShutdown|TestSearchesFindEveryDocumentWhileSegmentsMergeAfterWritesGoQuiet

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Install the TypeScript engine's runtime dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts --prod --filter @delali/narsil

      - name: Download the TypeScript engine
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: narsil-ts-dist
          path: packages/ts/dist

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.target.go }}
          cache: false

      - name: Download the conformance dataset
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: conformance-dataset
          path: packages/conformance/.dataset

      - name: Use llvm-mingw as the C compiler
        if: matrix.target.platform == 'win32-arm64'
        shell: pwsh
        env:
          LLVM_MINGW_RELEASE: '20261104'
          LLVM_MINGW_ARCHIVE: llvm-mingw-20261104-ucrt-aarch64
          LLVM_MINGW_SHA256: 7d7f8387a8706639b0b47a629d6e23f8b3ef9acce67e9832b8cd4c5bb2816eab
          LLVM_MINGW_CC: aarch64-w64-mingw32-clang
        run: |
          $archive = Join-Path $env:RUNNER_TEMP "$env:LLVM_MINGW_ARCHIVE.zip"
          Invoke-WebRequest -Uri "https://github.com/mstorsjo/llvm-mingw/releases/download/$env:LLVM_MINGW_RELEASE/$env:LLVM_MINGW_ARCHIVE.zip" -OutFile $archive -MaximumRetryCount 5 -RetryIntervalSec 5
          $digest = (Get-FileHash -Algorithm SHA256 -LiteralPath $archive).Hash.ToLowerInvariant()
          if ($digest -ne $env:LLVM_MINGW_SHA256) { throw "The llvm-mingw archive has the digest $digest, while the workflow pins $env:LLVM_MINGW_SHA256" }
          & (Join-Path $env:SystemRoot 'System32\tar.exe') -xf $archive -C $env:RUNNER_TEMP
          if ($LASTEXITCODE -ne 0) { throw "tar could not extract the llvm-mingw archive" }
          Join-Path $env:RUNNER_TEMP "$env:LLVM_MINGW_ARCHIVE\bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          "CC=$env:LLVM_MINGW_CC" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          & (Join-Path $env:RUNNER_TEMP "$env:LLVM_MINGW_ARCHIVE\bin\$env:LLVM_MINGW_CC.exe") --version

      - name: Test part ${{ matrix.shard }} of ${{ matrix.parts }}
        working-directory: packages/go/engine
        env:
          CGO_ENABLED: '1'
          PART: ${{ matrix.shard }}
          PARTS: ${{ matrix.parts }}
          RACE_FLAG: ${{ matrix.target.race && '-race' || '' }}
          PRINTS_TEST_DURATIONS: ${{ startsWith(matrix.target.platform, 'darwin') }}
        run: |
          case "$PARTS/$PART" in
            1/1) selection=() timeout=30m ;;
            4/1|5/1) selection=(-run "^(${PART_1_TESTS})\$") timeout=8m ;;
            4/2) selection=(-run "^(${PART_2_TESTS}|${PART_5_TESTS}|${PROMOTION_TEST})\$") timeout=8m ;;
            4/3|5/3) selection=(-run "^(${PART_3_TESTS})\$") timeout=8m ;;
            4/4) selection=(-skip "^(${PART_1_TESTS}|${PART_2_TESTS}|${PART_3_TESTS}|${PART_5_TESTS}|${PROMOTION_TEST})\$") timeout=8m ;;
            5/4) selection=(-skip "^(${PART_1_TESTS}|${PART_2_TESTS}|${PART_3_TESTS}|${PART_5_TESTS}|${PROMOTION_TEST}|${SYNCED_WRITE_TESTS})\$") timeout=8m ;;
            5/2) selection=(-run "^(${PART_2_TESTS}|${SYNCED_WRITE_TESTS})\$") timeout=8m ;;
            5/5) selection=(-run "^(${PART_5_TESTS}|${PROMOTION_TEST})\$") timeout=8m ;;
            2/1) selection=(-run "^(${PART_1_TESTS}|${PART_2_TESTS}|${PART_5_TESTS}|${PROMOTION_TEST}|${GRAPH_WRITES_TEST})\$") timeout=12m ;;
            2/2) selection=(-skip "^(${PART_1_TESTS}|${PART_2_TESTS}|${PART_5_TESTS}|${PROMOTION_TEST}|${GRAPH_WRITES_TEST})\$") timeout=12m ;;
            *) echo "The workflow selects no tests for part $PART of $PARTS" >&2; exit 1 ;;
          esac
          if [ "$PRINTS_TEST_DURATIONS" != true ]; then
            go test -count=1 $RACE_FLAG -timeout "$timeout" "${selection[@]}" ./...
            exit
          fi
          log="$RUNNER_TEMP/go-test-part-$PART.log"
          status=0
          go test -count=1 -v $RACE_FLAG -timeout "$timeout" "${selection[@]}" ./... > "$log" 2>&1 || status=$?
          echo "Each top-level test, slowest first:"
          grep -E '^--- (PASS|FAIL|SKIP): ' "$log" | sed -E 's/^--- [A-Z]+: (.*) \(([0-9.]+)s\)$/\2s \1/' | sort -rn || true
          grep -E '^(ok|FAIL|---)[[:space:]]' "$log" | grep -vE '^--- (PASS|SKIP): ' || true
          if [ "$status" -ne 0 ]; then
            echo "go test exited with $status, so the full output follows:"
            cat "$log"
          fi
          exit "$status"
