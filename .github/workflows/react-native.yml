name: React Native

on:
  push:
    branches: [main]
    paths:
      - 'packages/react-native/**'
      - 'packages/native/src/**'
      - 'packages/native/include/**'
      - 'packages/ts/src/**'
      - 'packages/ts/package.json'
      - 'packages/ts/tsup.config.ts'
      - 'pnpm-lock.yaml'
      - '.github/workflows/react-native.yml'
  pull_request:
    branches: [main]
    paths:
      - 'packages/react-native/**'
      - 'packages/native/src/**'
      - 'packages/native/include/**'
      - 'packages/ts/src/**'
      - 'packages/ts/package.json'
      - 'packages/ts/tsup.config.ts'
      - 'pnpm-lock.yaml'
      - '.github/workflows/react-native.yml'

permissions:
  contents: read

concurrency:
  group: react-native-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android (${{ matrix.app }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: expo
            package: '@delali/narsil-example-react-native-expo'
            native: pnpm exec expo prebuild --platform android --no-install --clean
          - app: bare
            package: '@delali/narsil-example-react-native-bare'
            native: pnpm run native-projects

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build the engine
        run: pnpm nx run narsil-ts:build:code

      - name: Copy the search core into the package
        run: node packages/react-native/scripts/copy-core.mjs

      - name: Write the native project
        working-directory: packages/react-native/examples/${{ matrix.app }}
        env:
          CI: '1'
        run: ${{ matrix.native }}

      - name: Build the release APK
        working-directory: packages/react-native/examples/${{ matrix.app }}/android
        env:
          NODE_ENV: production
        run: |
          export JAVA_HOME="$JAVA_HOME_17_X64"
          ./gradlew --no-daemon assembleRelease

      - name: Check that every native library loads on 16 KB pages
        working-directory: packages/react-native/examples/${{ matrix.app }}/android
        run: |
          libraries="$RUNNER_TEMP/apk-libraries"
          unzip -o -q app/build/outputs/apk/release/app-release.apk 'lib/*' -d "$libraries"
          ls "$libraries/lib" | grep -qx arm64-v8a
          if ls "$libraries/lib" | grep -Eqx 'armeabi-v7a|x86'; then
            echo "The APK carries a 32-bit library folder" && exit 1
          fi
          narsil=$(find "$libraries/lib" -name 'libNarsilReactNative.so' | wc -l)
          [ "$narsil" -gt 0 ] || { echo "The APK carries no libNarsilReactNative.so" && exit 1; }
          failed=0
          for library in "$libraries"/lib/*/*.so; do
            for align in $(readelf -lW "$library" | awk '$1 == "LOAD" { print $NF }'); do
              if [ $((align)) -lt 16384 ]; then
                echo "$library has a LOAD segment aligned to $align"
                failed=1
              fi
            done
          done
          exit $failed

  ios:
    name: iOS (${{ matrix.app }})
    runs-on: macos-26
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: expo
            native: pnpm exec expo prebuild --platform ios --clean
            workspace: NarsilCheck
          - app: bare
            native: pnpm run native-projects && cd ios && pod install
            workspace: NarsilBare

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build the engine
        run: pnpm nx run narsil-ts:build:code

      - name: Copy the search core into the package
        run: node packages/react-native/scripts/copy-core.mjs

      - name: Write the native project
        working-directory: packages/react-native/examples/${{ matrix.app }}
        env:
          CI: '1'
        run: ${{ matrix.native }}

      - name: Build the release app for a phone
        working-directory: packages/react-native/examples/${{ matrix.app }}/ios
        run: |
          xcodebuild -workspace ${{ matrix.workspace }}.xcworkspace -scheme ${{ matrix.workspace }} \
            -configuration Release -sdk iphoneos -destination generic/platform=iOS \
            -derivedDataPath "$RUNNER_TEMP/derived" CODE_SIGNING_ALLOWED=NO build
