name: Vector Recall

on:
  push:
    branches: [main]
    paths:
      - 'packages/ts/src/vector/**'
      - 'packages/ts/src/__tests__/vector/recall.test.ts'
  pull_request:
    branches: [main]
    paths:
      - 'packages/ts/src/vector/**'
      - 'packages/ts/src/__tests__/vector/recall.test.ts'

permissions:
  contents: read

concurrency:
  group: vector-recall-${{ github.ref }}
  cancel-in-progress: true

jobs:
  vector-recall-tests:
    name: Vector Recall Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm nx run narsil-ts:build

      - name: Run vector recall tests
        run: pnpm nx run narsil-ts:test:recall
        timeout-minutes: 10
