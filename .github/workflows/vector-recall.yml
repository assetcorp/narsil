name: Vector Recall

on:
  push:
    branches: [main]
    paths:
      - 'packages/ts/src/vector/**'
      - 'packages/ts/src/__tests__/vector/recall.test.ts'
  pull_request:
    branches: [main]
    paths:
      - 'packages/ts/src/vector/**'
      - 'packages/ts/src/__tests__/vector/recall.test.ts'

permissions:
  contents: read

concurrency:
  group: vector-recall-${{ github.ref }}
  cancel-in-progress: true

jobs:
  vector-recall-tests:
    name: Vector Recall Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm nx run narsil-ts:build

      - name: Run vector recall tests
        run: pnpm nx run narsil-ts:test:recall
        timeout-minutes: 10
