name: Python package

on:
  push:
    branches: [main]
    paths:
      - 'packages/python-engine/**'
      - 'packages/rust/**'
      - 'packages/native/src/**'
      - 'packages/native/include/**'
      - 'packages/conformance/**'
      - 'packages/ts/src/**'
      - '.github/workflows/python-engine.yml'
      - '!**/*.md'
      - '!packages/rust/tests/**'
      - '!packages/ts/src/__tests__/**'
      - '!packages/ts/src/client/**'
      - '!packages/ts/src/react/**'
      - '!packages/ts/src/http-retry/**'
      - '!packages/ts/src/rerankers/**'
      - '!packages/ts/src/embeddings/**'
      - '!packages/ts/src/invalidation/**'
  pull_request:
    branches: [main]
    paths:
      - 'packages/python-engine/**'
      - 'packages/rust/**'
      - 'packages/native/src/**'
      - 'packages/native/include/**'
      - 'packages/conformance/**'
      - 'packages/ts/src/**'
      - '.github/workflows/python-engine.yml'
      - '!**/*.md'
      - '!packages/rust/tests/**'
      - '!packages/ts/src/__tests__/**'
      - '!packages/ts/src/client/**'
      - '!packages/ts/src/react/**'
      - '!packages/ts/src/http-retry/**'
      - '!packages/ts/src/rerankers/**'
      - '!packages/ts/src/embeddings/**'
      - '!packages/ts/src/invalidation/**'
  workflow_call:
    inputs:
      ref:
        description: 'The commit to build, such as a release commit; empty builds the commit that started the run'
        required: false
        type: string
        default: ''
      run-tests:
        description: 'Test every wheel on its platform after the build'
        required: false
        type: boolean
        default: true
      artifact-prefix:
        description: 'The prefix of every artifact name, which keeps two calls in one run apart'
        required: false
        type: string
        default: 'python-engine'

permissions:
  contents: read

concurrency:
  group: python-engine-${{ github.workflow }}-${{ github.ref }}-${{ inputs.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint and type-check
    if: ${{ format('{0}', inputs.run-tests) != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'

      - name: Install the pinned Rust toolchain
        working-directory: packages/python-engine
        run: rustup toolchain install

      - name: Check the Rust formatting
        working-directory: packages/python-engine
        run: cargo fmt --all --check

      - name: Check the Rust code with Clippy, treating every warning as an error
        working-directory: packages/python-engine
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Lint the Python code
        working-directory: packages/python-engine
        run: |
          python3 scripts/tools.py ruff check .
          python3 scripts/tools.py ruff format --check .

      - name: Type-check the Python code and the stubs
        working-directory: packages/python-engine
        run: python3 scripts/tools.py mypy

  reference:
    name: Save the reference index with the TypeScript engine
    if: ${{ format('{0}', inputs.run-tests) != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Restore the pinned conformance dataset
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: packages/conformance/.dataset
          key: conformance-dataset-${{ hashFiles('packages/conformance/dataset-pin.json') }}

      - name: Build the conformance tools
        run: pnpm nx run narsil-conformance:build

      - name: Fetch the pinned dataset and check every digest
        working-directory: packages/conformance
        run: node dist/cli.mjs fetch

      - name: Build the TypeScript engine
        run: pnpm nx run narsil-ts:build:code

      - name: Save the dataset into a durable directory and record the TypeScript answers
        run: |
          mkdir -p "$RUNNER_TEMP/reference"
          node packages/python-engine/tests/support/save_reference.mjs "$GITHUB_WORKSPACE" "$RUNNER_TEMP/reference/index" bills 500 > "$RUNNER_TEMP/reference/answers.json"
          node packages/python-engine/tests/support/error_codes.mjs "$GITHUB_WORKSPACE" packages/python-engine/tests/support/error_cases.json > "$RUNNER_TEMP/reference/error_codes.json"

      - name: Upload the reference index
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ inputs.artifact-prefix || 'python-engine' }}-typescript-reference
          path: ${{ runner.temp }}/reference
          include-hidden-files: true
          if-no-files-found: error

      - name: Upload the conformance dataset
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ inputs.artifact-prefix || 'python-engine' }}-conformance-dataset
          path: packages/conformance/.dataset
          include-hidden-files: true
          if-no-files-found: error

  wheels:
    name: Build the wheel for ${{ matrix.label }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: linux-x64-gnu
            runner: ubuntu-latest
            target: x86_64
            manylinux: '2014'
          - label: linux-arm64-gnu
            runner: ubuntu-24.04-arm
            target: aarch64
            manylinux: '2014'
          - label: linux-x64-musl
            runner: ubuntu-latest
            target: x86_64
            manylinux: musllinux_1_2
          - label: linux-arm64-musl
            runner: ubuntu-24.04-arm
            target: aarch64
            manylinux: musllinux_1_2
          - label: darwin-arm64
            runner: macos-15
            target: aarch64
          - label: darwin-x64
            runner: macos-15-intel
            target: x86_64
          - label: win32-x64
            runner: windows-latest
            target: x64
          - label: win32-arm64
            runner: windows-11-arm
            target: aarch64

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}

      - name: Setup Python
        if: ${{ !startsWith(matrix.label, 'linux-') }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'

      - name: Read the pinned Rust toolchain
        id: toolchain
        shell: bash
        run: echo "channel=$(sed -n 's/^channel = "\(.*\)"$/\1/p' packages/python-engine/rust-toolchain.toml)" >> "$GITHUB_OUTPUT"

      - name: Build the wheel
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          working-directory: packages/python-engine
          maturin-version: v1.16.0
          rust-toolchain: ${{ steps.toolchain.outputs.channel }}
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux || 'auto' }}
          args: --release --locked --out dist

      - name: Upload the wheel
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ inputs.artifact-prefix || 'python-engine' }}-wheel-${{ matrix.label }}
          path: packages/python-engine/dist/*.whl
          if-no-files-found: error

  test:
    name: Test the ${{ matrix.platform.label }} wheel on Python ${{ matrix.python }}
    needs: [reference, wheels]
    if: ${{ format('{0}', inputs.run-tests) != 'false' }}
    runs-on: ${{ matrix.platform.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.14']
        platform:
          - { label: linux-x64-gnu, runner: ubuntu-latest, musl: false }
          - { label: linux-arm64-gnu, runner: ubuntu-24.04-arm, musl: false }
          - { label: linux-x64-musl, runner: ubuntu-latest, musl: true }
          - { label: linux-arm64-musl, runner: ubuntu-24.04-arm, musl: true }
          - { label: darwin-arm64, runner: macos-15, musl: false }
          - { label: darwin-x64, runner: macos-15-intel, musl: false }
          - { label: win32-x64, runner: windows-latest, musl: false }
          - { label: win32-arm64, runner: windows-11-arm, musl: false }

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}

      - name: Download the wheel
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ inputs.artifact-prefix || 'python-engine' }}-wheel-${{ matrix.platform.label }}
          path: wheelhouse

      - name: Download the conformance dataset
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ inputs.artifact-prefix || 'python-engine' }}-conformance-dataset
          path: packages/conformance/.dataset

      - name: Download the reference index
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ inputs.artifact-prefix || 'python-engine' }}-typescript-reference
          path: reference

      - name: Setup Python
        if: ${{ !matrix.platform.musl }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}

      - name: Install the wheel and test it
        if: ${{ !matrix.platform.musl }}
        shell: bash
        working-directory: packages/python-engine
        env:
          NARSIL_TYPESCRIPT_REFERENCE: ${{ github.workspace }}/reference
        run: |
          python -m pip install --disable-pip-version-check --require-hashes --only-binary=:all: --requirement requirements-test.txt
          python -m pip install --disable-pip-version-check --no-index --find-links ../../wheelhouse delali-narsil
          python -m pytest

      - name: Install the wheel and test it in Alpine Linux
        if: ${{ matrix.platform.musl }}
        env:
          PYTHON_VERSION: ${{ matrix.python }}
        run: |
          docker run --rm \
            --volume "$GITHUB_WORKSPACE:/workspace" \
            --workdir /workspace/packages/python-engine \
            --env NARSIL_TYPESCRIPT_REFERENCE=/workspace/reference \
            "python:${PYTHON_VERSION}-alpine" \
            sh -ec '
              python -m pip install --disable-pip-version-check --root-user-action=ignore --require-hashes --only-binary=:all: --requirement requirements-test.txt
              python -m pip install --disable-pip-version-check --root-user-action=ignore --no-index --find-links ../../wheelhouse delali-narsil
              python -m pytest -p no:cacheprovider
            '
