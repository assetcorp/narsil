name: Rust cluster

on:
  workflow_call:

permissions:
  contents: read

jobs:
  lint:
    name: Format and Clippy
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install the pinned protoc and check its digest
        uses: ./.github/actions/install-protoc

      - name: Install the pinned Rust toolchain
        working-directory: packages/rust-cluster
        run: rustup toolchain install

      - name: Check the formatting
        working-directory: packages/rust-cluster
        run: cargo fmt --all --check

      - name: Run Clippy with every warning as an error
        working-directory: packages/rust-cluster
        run: cargo clippy --all-targets --locked -- -D warnings

  test:
    name: Test on ${{ matrix.label }}, part ${{ matrix.shard }} of ${{ matrix.parts }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include: >-
          ${{ fromJSON(github.event_name == 'push' && '[
          {"label": "linux-x64", "runner": "ubuntu-latest", "parts": 1, "shard": 1},
          {"label": "win32-x64", "runner": "windows-latest", "parts": 2, "shard": 1},
          {"label": "win32-x64", "runner": "windows-latest", "parts": 2, "shard": 2}
          ]' || '[
          {"label": "linux-x64", "runner": "ubuntu-latest", "parts": 1, "shard": 1},
          {"label": "darwin-arm64", "runner": "macos-15", "parts": 1, "shard": 1},
          {"label": "win32-x64", "runner": "windows-latest", "parts": 2, "shard": 1},
          {"label": "win32-x64", "runner": "windows-latest", "parts": 2, "shard": 2}
          ]') }}
    services:
      etcd:
        image: ${{ matrix.label == 'linux-x64' && 'gcr.io/etcd-development/etcd:v3.6.0' || '' }}
        entrypoint: /usr/local/bin/etcd
        command: >-
          --name node1
          --data-dir /etcd-data
          --listen-client-urls http://0.0.0.0:2379
          --advertise-client-urls http://127.0.0.1:2379
          --listen-peer-urls http://0.0.0.0:2380
          --initial-advertise-peer-urls http://127.0.0.1:2380
          --initial-cluster node1=http://127.0.0.1:2380
        ports:
          - 2379:2379

    env:
      PART_1_TESTS: cluster

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install the TypeScript transports' dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts --filter @delali/narsil

      - name: Download the TypeScript engine
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: narsil-ts-dist
          path: packages/ts/dist

      - name: Install the pinned protoc and check its digest
        uses: ./.github/actions/install-protoc

      - name: Install the pinned Rust toolchain
        working-directory: packages/rust-cluster
        run: rustup toolchain install

      - name: Test against the TypeScript transports and etcd
        if: matrix.parts == 1
        working-directory: packages/rust-cluster
        env:
          NARSIL_ETCD_ENDPOINT: ${{ matrix.label == 'linux-x64' && 'http://127.0.0.1:2379' || '' }}
        run: cargo test --locked --no-fail-fast

      - name: Test part ${{ matrix.shard }} of ${{ matrix.parts }} against the TypeScript transports and etcd
        if: matrix.parts != 1
        working-directory: packages/rust-cluster
        shell: bash
        env:
          NARSIL_ETCD_ENDPOINT: ${{ matrix.label == 'linux-x64' && 'http://127.0.0.1:2379' || '' }}
          PART: ${{ matrix.shard }}
          PARTS: ${{ matrix.parts }}
        run: |
          case "$PARTS/$PART" in
            2/1) selection=listed names="$PART_1_TESTS" ;;
            2/2) selection=unlisted names="$PART_1_TESTS" ;;
            *) echo "The workflow selects no tests for part $PART of $PARTS" >&2; exit 1 ;;
          esac
          if [ "$selection" = listed ]; then
            read -ra targets <<< "$names"
          else
            listed=" $names "
            declared="$(cargo metadata --locked --no-deps --format-version 1 | node -e 'const chunks = []; process.stdin.on("data", chunk => chunks.push(chunk)).on("end", () => { for (const target of JSON.parse(Buffer.concat(chunks).toString("utf8")).packages.flatMap(entry => entry.targets)) if (target.kind.includes("test")) console.log(target.name) })' | tr -d '\r')"
            targets=()
            while read -r target; do
              [ -z "$target" ] || [[ "$listed" == *" $target "* ]] || targets+=("$target")
            done <<< "$declared"
          fi
          if [ "${#targets[@]}" -eq 0 ]; then
            echo "Part $PART of $PARTS selects no test target" >&2
            exit 1
          fi
          arguments=()
          for target in "${targets[@]}"; do arguments+=(--test "$target"); done
          if [ "$PART" = "$PARTS" ]; then
            cargo test --locked --no-fail-fast --lib "${arguments[@]}"
            cargo test --locked --no-fail-fast --doc
          else
            cargo test --locked --no-fail-fast "${arguments[@]}"
          fi

  mixed-cluster:
    name: A Rust node beside a TypeScript node
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install the TypeScript package's dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts --filter @delali/narsil

      - name: Download the TypeScript engine
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: narsil-ts-dist
          path: packages/ts/dist

      - name: Install the pinned protoc and check its digest
        uses: ./.github/actions/install-protoc

      - name: Install the pinned Rust toolchain
        working-directory: packages/rust-server
        run: rustup toolchain install

      - name: Build the Rust fault node
        working-directory: packages/rust-server
        run: cargo build --locked --features cluster --example fault_node

      - name: Run the mixed cluster over TCP and gRPC
        working-directory: packages/ts
        env:
          NARSIL_RUST_CLUSTER_NODE: ${{ github.workspace }}/packages/rust-server/target/debug/examples/fault_node
        run: >-
          pnpm vitest run --no-file-parallelism
          src/__tests__/e2e/cluster-faults/rust-node.test.ts
          src/__tests__/e2e/cluster-faults/rust-controller.test.ts
          src/__tests__/e2e/cluster-faults/rust-controller-handover.test.ts

      - name: Run one seed of faults with a Rust node in the middle slot
        working-directory: packages/ts
        env:
          NARSIL_RUST_CLUSTER_NODE: ${{ github.workspace }}/packages/rust-server/target/debug/examples/fault_node
          NARSIL_FAULT_RUST_SLOTS: '1'
        run: pnpm vitest run src/__tests__/e2e/cluster-faults/seeded-faults.test.ts
