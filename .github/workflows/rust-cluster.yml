name: Rust cluster

on:
  workflow_call:

permissions:
  contents: read

jobs:
  lint:
    name: Format and Clippy
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install the pinned protoc and check its digest
        uses: ./.github/actions/install-protoc

      - name: Install the pinned Rust toolchain
        working-directory: packages/rust-cluster
        run: rustup toolchain install

      - name: Check the formatting
        working-directory: packages/rust-cluster
        run: cargo fmt --all --check

      - name: Run Clippy with every warning as an error
        working-directory: packages/rust-cluster
        run: cargo clippy --all-targets --locked -- -D warnings

  test:
    name: Test on ${{ matrix.label }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include: >-
          ${{ fromJSON(github.event_name == 'push' && '[
          {"label": "linux-x64", "runner": "ubuntu-latest"},
          {"label": "win32-x64", "runner": "windows-latest"}
          ]' || '[
          {"label": "linux-x64", "runner": "ubuntu-latest"},
          {"label": "darwin-arm64", "runner": "macos-15"},
          {"label": "win32-x64", "runner": "windows-latest"}
          ]') }}
    services:
      etcd:
        image: ${{ matrix.label == 'linux-x64' && 'gcr.io/etcd-development/etcd:v3.6.0' || '' }}
        entrypoint: /usr/local/bin/etcd
        command: >-
          --name node1
          --data-dir /etcd-data
          --listen-client-urls http://0.0.0.0:2379
          --advertise-client-urls http://127.0.0.1:2379
          --listen-peer-urls http://0.0.0.0:2380
          --initial-advertise-peer-urls http://127.0.0.1:2380
          --initial-cluster node1=http://127.0.0.1:2380
        ports:
          - 2379:2379

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install the TypeScript transports' dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts --filter @delali/narsil

      - name: Download the TypeScript engine
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: narsil-ts-dist
          path: packages/ts/dist

      - name: Install the pinned protoc and check its digest
        uses: ./.github/actions/install-protoc

      - name: Install the pinned Rust toolchain
        working-directory: packages/rust-cluster
        run: rustup toolchain install

      - name: Test against the TypeScript transports and etcd
        working-directory: packages/rust-cluster
        env:
          NARSIL_ETCD_ENDPOINT: ${{ matrix.label == 'linux-x64' && 'http://127.0.0.1:2379' || '' }}
        run: cargo test --locked --no-fail-fast

  mixed-cluster:
    name: A Rust node beside a TypeScript node
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install the TypeScript package's dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts --filter @delali/narsil

      - name: Download the TypeScript engine
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: narsil-ts-dist
          path: packages/ts/dist

      - name: Install the pinned protoc and check its digest
        uses: ./.github/actions/install-protoc

      - name: Install the pinned Rust toolchain
        working-directory: packages/rust-cluster
        run: rustup toolchain install

      - name: Build the Rust fault node
        working-directory: packages/rust-cluster
        run: cargo build --locked --example fault_node

      - name: Run the mixed cluster over TCP and gRPC
        working-directory: packages/ts
        env:
          NARSIL_RUST_CLUSTER_NODE: ${{ github.workspace }}/packages/rust-cluster/target/debug/examples/fault_node
        run: pnpm vitest run src/__tests__/e2e/cluster-faults/rust-node.test.ts
