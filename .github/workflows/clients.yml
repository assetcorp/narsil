name: Clients

on:
  workflow_call:

permissions:
  contents: read

jobs:
  python:
    name: Python client (${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ${{ fromJSON(github.event_name == 'pull_request' && '["3.14"]' || '["3.11", "3.14"]') }}
    services:
      etcd:
        image: gcr.io/etcd-development/etcd:v3.6.0
        entrypoint: /usr/local/bin/etcd
        command: >-
          --name node1
          --data-dir /etcd-data
          --listen-client-urls http://0.0.0.0:2379
          --advertise-client-urls http://127.0.0.1:2379
          --listen-peer-urls http://0.0.0.0:2380
          --initial-advertise-peer-urls http://127.0.0.1:2380
          --initial-cluster node1=http://127.0.0.1:2380
        ports:
          - 2379:2379

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generated code matches the OpenAPI file
        run: pnpm nx run narsil-python:generate

      - name: Lint
        run: pnpm nx run narsil-python:lint

      - name: Typecheck
        run: pnpm nx run narsil-python:typecheck

      - name: Type-check the README example
        working-directory: packages/python
        run: node ../../.github/scripts/check-readme-examples.js python README.md

      - name: Download the TypeScript engine that the live server loads
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: narsil-ts-dist
          path: packages/ts/dist

      - name: Test on a live server and a three-node cluster
        env:
          NARSIL_ETCD_ENDPOINT: http://127.0.0.1:2379
        run: pnpm nx run narsil-python:test --exclude-task-dependencies

      - name: Build the PyPI package
        run: pnpm nx run narsil-python:package

  go:
    name: Go client (${{ matrix.go }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        go: ${{ fromJSON(github.event_name == 'pull_request' && '["stable"]' || '["1.26", "stable"]') }}
    services:
      etcd:
        image: gcr.io/etcd-development/etcd:v3.6.0
        entrypoint: /usr/local/bin/etcd
        command: >-
          --name node1
          --data-dir /etcd-data
          --listen-client-urls http://0.0.0.0:2379
          --advertise-client-urls http://127.0.0.1:2379
          --listen-peer-urls http://0.0.0.0:2380
          --initial-advertise-peer-urls http://127.0.0.1:2380
          --initial-cluster node1=http://127.0.0.1:2380
        ports:
          - 2379:2379

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go }}
          cache: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generated code matches the OpenAPI file
        run: pnpm nx run narsil-go:generate

      - name: Lint
        run: pnpm nx run narsil-go:lint

      - name: Typecheck
        run: pnpm nx run narsil-go:typecheck

      - name: Compile the README example
        working-directory: packages/go
        run: node ../../.github/scripts/check-readme-examples.js go README.md

      - name: Download the TypeScript engine that the live server loads
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: narsil-ts-dist
          path: packages/ts/dist

      - name: Test on a live server and a three-node cluster
        env:
          NARSIL_ETCD_ENDPOINT: http://127.0.0.1:2379
        run: pnpm nx run narsil-go:test --exclude-task-dependencies

      - name: Lint the change feed subscriber
        run: pnpm nx run narsil-go-changes:lint

      - name: Typecheck the change feed subscriber
        run: pnpm nx run narsil-go-changes:typecheck

      - name: Test the change feed subscriber on a live server
        run: pnpm nx run narsil-go-changes:test --exclude-task-dependencies
