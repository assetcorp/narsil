name: Rust crate

on:
  workflow_call:

permissions:
  contents: read

jobs:
  lint:
    name: Format and Clippy
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install the pinned Rust toolchain
        working-directory: packages/rust
        run: rustup toolchain install

      - name: Check the formatting
        working-directory: packages/rust
        run: cargo fmt --all --check

      - name: Run Clippy with every warning as an error
        working-directory: packages/rust
        run: cargo clippy --all-targets --locked -- -D warnings

  test:
    name: Test on ${{ matrix.label }}, part ${{ matrix.shard }} of ${{ matrix.parts }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include: >-
          ${{ fromJSON((github.event_name == 'pull_request' || github.event_name == 'push') && '[
          {"label": "linux-x64", "runner": "ubuntu-latest", "parts": 1, "shard": 1},
          {"label": "darwin-arm64", "runner": "macos-15", "parts": 1, "shard": 1},
          {"label": "win32-x64", "runner": "windows-latest", "parts": 4, "shard": 1},
          {"label": "win32-x64", "runner": "windows-latest", "parts": 4, "shard": 2},
          {"label": "win32-x64", "runner": "windows-latest", "parts": 4, "shard": 3},
          {"label": "win32-x64", "runner": "windows-latest", "parts": 4, "shard": 4}
          ]' || '[
          {"label": "linux-x64", "runner": "ubuntu-latest", "parts": 1, "shard": 1},
          {"label": "linux-arm64", "runner": "ubuntu-24.04-arm", "parts": 1, "shard": 1},
          {"label": "darwin-arm64", "runner": "macos-15", "parts": 1, "shard": 1},
          {"label": "darwin-x64", "runner": "macos-15-intel", "parts": 1, "shard": 1},
          {"label": "win32-x64", "runner": "windows-latest", "parts": 1, "shard": 1},
          {"label": "win32-arm64", "runner": "windows-11-arm", "parts": 1, "shard": 1}
          ]') }}

    env:
      PART_1_TESTS: durable_crash filter_parity analysis_change
      PART_2_TESTS: removed_rewrite_crash rebalance parallel_search
      PART_3_TESTS: pattern_segment_merge vector_build_race vector_writes saved_size shaping_parity index_lifecycle

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install the TypeScript engine's and the conformance tools' dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts --filter @delali/narsil --filter @delali/narsil-conformance

      - name: Build the conformance tools
        working-directory: packages/conformance
        run: pnpm tsup

      - name: Download the TypeScript engine
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: narsil-ts-dist
          path: packages/ts/dist

      - name: Download the conformance dataset
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: conformance-dataset
          path: packages/conformance/.dataset

      - name: Install the pinned Rust toolchain
        working-directory: packages/rust
        run: rustup toolchain install

      - name: Test
        if: matrix.parts == 1
        working-directory: packages/rust
        run: cargo test --locked --no-fail-fast

      - name: Test part ${{ matrix.shard }} of ${{ matrix.parts }}
        if: matrix.parts != 1
        working-directory: packages/rust
        shell: bash
        env:
          PART: ${{ matrix.shard }}
          PARTS: ${{ matrix.parts }}
        run: |
          case "$PARTS/$PART" in
            4/1) read -ra targets <<< "$PART_1_TESTS" ;;
            4/2) read -ra targets <<< "$PART_2_TESTS" ;;
            4/3) read -ra targets <<< "$PART_3_TESTS" ;;
            4/4)
              listed=" $PART_1_TESTS $PART_2_TESTS $PART_3_TESTS "
              declared="$(cargo metadata --locked --no-deps --format-version 1 | node -e 'const chunks = []; process.stdin.on("data", chunk => chunks.push(chunk)).on("end", () => { for (const target of JSON.parse(Buffer.concat(chunks).toString("utf8")).packages.flatMap(entry => entry.targets)) if (target.kind.includes("test")) console.log(target.name) })' | tr -d '\r')"
              targets=()
              while read -r target; do
                [ -z "$target" ] || [[ "$listed" == *" $target "* ]] || targets+=("$target")
              done <<< "$declared"
              ;;
            *) echo "The workflow selects no tests for part $PART of $PARTS" >&2; exit 1 ;;
          esac
          if [ "${#targets[@]}" -eq 0 ]; then
            echo "Part $PART of $PARTS selects no test target" >&2
            exit 1
          fi
          arguments=()
          for target in "${targets[@]}"; do arguments+=(--test "$target"); done
          if [ "$PART" = "$PARTS" ]; then
            cargo test --locked --no-fail-fast --lib "${arguments[@]}"
            cargo test --locked --no-fail-fast --doc
          else
            cargo test --locked --no-fail-fast "${arguments[@]}"
          fi
