name: Rust crate

on:
  workflow_call:

permissions:
  contents: read

jobs:
  lint:
    name: Format and Clippy
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install the pinned Rust toolchain
        working-directory: packages/rust
        run: rustup toolchain install

      - name: Check the formatting
        working-directory: packages/rust
        run: cargo fmt --all --check

      - name: Run Clippy with every warning as an error
        working-directory: packages/rust
        run: cargo clippy --all-targets --locked -- -D warnings

  test:
    name: Test on ${{ matrix.label }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include: >-
          ${{ fromJSON(github.event_name == 'pull_request' && '[
          {"label": "linux-x64", "runner": "ubuntu-latest"}
          ]' || '[
          {"label": "linux-x64", "runner": "ubuntu-latest"},
          {"label": "linux-arm64", "runner": "ubuntu-24.04-arm"},
          {"label": "darwin-arm64", "runner": "macos-15"},
          {"label": "darwin-x64", "runner": "macos-15-intel"},
          {"label": "win32-x64", "runner": "windows-latest"},
          {"label": "win32-arm64", "runner": "windows-11-arm"}
          ]') }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install the TypeScript engine's and the conformance tools' dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts --filter @delali/narsil --filter @delali/narsil-conformance

      - name: Build the conformance tools
        working-directory: packages/conformance
        run: pnpm tsup

      - name: Download the TypeScript engine
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: narsil-ts-dist
          path: packages/ts/dist

      - name: Download the conformance dataset
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: conformance-dataset
          path: packages/conformance/.dataset

      - name: Install the pinned Rust toolchain
        working-directory: packages/rust
        run: rustup toolchain install

      - name: Test
        working-directory: packages/rust
        run: cargo test --locked --no-fail-fast
