name: Rust crate

on:
  push:
    branches: [main]
    paths:
      - 'packages/rust/**'
      - 'packages/native/src/**'
      - 'packages/native/include/**'
      - 'packages/conformance/**'
      - 'packages/ts/src/**'
      - '.github/workflows/rust.yml'
      - '!**/*.md'
      - '!packages/ts/src/__tests__/**'
      - '!packages/ts/src/client/**'
      - '!packages/ts/src/react/**'
      - '!packages/ts/src/http-retry/**'
      - '!packages/ts/src/rerankers/**'
      - '!packages/ts/src/embeddings/**'
      - '!packages/ts/src/invalidation/**'
      - 'packages/rust/README.md'
  pull_request:
    branches: [main]
    paths:
      - 'packages/rust/**'
      - 'packages/native/src/**'
      - 'packages/native/include/**'
      - 'packages/conformance/**'
      - 'packages/ts/src/**'
      - '.github/workflows/rust.yml'
      - '!**/*.md'
      - '!packages/ts/src/__tests__/**'
      - '!packages/ts/src/client/**'
      - '!packages/ts/src/react/**'
      - '!packages/ts/src/http-retry/**'
      - '!packages/ts/src/rerankers/**'
      - '!packages/ts/src/embeddings/**'
      - '!packages/ts/src/invalidation/**'
      - 'packages/rust/README.md'
  workflow_call:

permissions:
  contents: read

concurrency:
  group: rust-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Format and Clippy
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install the pinned Rust toolchain
        working-directory: packages/rust
        run: rustup toolchain install

      - name: Check the formatting
        working-directory: packages/rust
        run: cargo fmt --all --check

      - name: Run Clippy with every warning as an error
        working-directory: packages/rust
        run: cargo clippy --all-targets --locked -- -D warnings

  reference:
    name: Build the TypeScript engine and fetch the conformance dataset
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Restore the pinned conformance dataset
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: packages/conformance/.dataset
          key: conformance-dataset-${{ hashFiles('packages/conformance/dataset-pin.json') }}

      - name: Build the conformance tools
        run: pnpm nx run narsil-conformance:build

      - name: Fetch the pinned dataset and check every digest
        working-directory: packages/conformance
        run: node dist/cli.mjs fetch

      - name: Build the TypeScript engine that the tests compare against
        run: pnpm nx run narsil-ts:build:code

      - name: Upload the TypeScript engine
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: narsil-ts-dist
          path: packages/ts/dist
          if-no-files-found: error

      - name: Upload the conformance dataset
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: conformance-dataset
          path: packages/conformance/.dataset
          include-hidden-files: true
          if-no-files-found: error

  test:
    name: Test on ${{ matrix.label }}
    needs: reference
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: linux-x64
            runner: ubuntu-latest
          - label: linux-arm64
            runner: ubuntu-24.04-arm
          - label: darwin-arm64
            runner: macos-15
          - label: darwin-x64
            runner: macos-15-intel
          - label: win32-x64
            runner: windows-latest
          - label: win32-arm64
            runner: windows-11-arm

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install the TypeScript engine's and the conformance tools' dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts --filter @delali/narsil --filter @delali/narsil-conformance

      - name: Build the conformance tools
        working-directory: packages/conformance
        run: pnpm tsup

      - name: Download the TypeScript engine
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: narsil-ts-dist
          path: packages/ts/dist

      - name: Download the conformance dataset
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: conformance-dataset
          path: packages/conformance/.dataset

      - name: Install the pinned Rust toolchain
        working-directory: packages/rust
        run: rustup toolchain install

      - name: Test
        working-directory: packages/rust
        run: cargo test --locked --no-fail-fast
