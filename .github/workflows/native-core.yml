name: Native search core

on:
  push:
    branches: [main]
    paths:
      - 'packages/native/**'
      - 'packages/ts/src/vector/**'
      - 'packages/ts/src/languages/**'
      - 'packages/ts/src/core/tokenizer/**'
      - 'packages/ts/src/core/keyword-score/**'
      - 'packages/ts/src/core/partition/**'
      - 'packages/ts/src/core/inverted-index/**'
      - 'packages/ts/src/core/synonyms/**'
      - 'packages/ts/src/core/ordering/**'
      - 'packages/ts/src/core/scorer.ts'
      - 'packages/ts/src/math/**'
      - 'packages/ts/src/geo/**'
      - 'packages/ts/src/__tests__/core/tokenizer/**'
      - 'packages/ts/src/__tests__/core/keyword-score/**'
      - 'packages/ts/src/__tests__/math/**'
      - 'packages/ts/scripts/native-analysis/**'
      - 'packages/ts/wasm/**'
      - '.github/workflows/native-core.yml'
      - '!**/*.md'
  pull_request:
    branches: [main]
    paths:
      - 'packages/native/**'
      - 'packages/ts/src/vector/**'
      - 'packages/ts/src/languages/**'
      - 'packages/ts/src/core/tokenizer/**'
      - 'packages/ts/src/core/keyword-score/**'
      - 'packages/ts/src/core/partition/**'
      - 'packages/ts/src/core/inverted-index/**'
      - 'packages/ts/src/core/synonyms/**'
      - 'packages/ts/src/core/ordering/**'
      - 'packages/ts/src/core/scorer.ts'
      - 'packages/ts/src/math/**'
      - 'packages/ts/src/geo/**'
      - 'packages/ts/src/__tests__/core/tokenizer/**'
      - 'packages/ts/src/__tests__/core/keyword-score/**'
      - 'packages/ts/src/__tests__/math/**'
      - 'packages/ts/scripts/native-analysis/**'
      - 'packages/ts/wasm/**'
      - '.github/workflows/native-core.yml'
      - '!**/*.md'
  workflow_call:

permissions:
  contents: read

concurrency:
  group: native-core-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: darwin-arm64
            runner: macos-15
            output: packages/native/npm/darwin-arm64
          - target: darwin-x64
            runner: macos-15
            output: packages/native/npm/darwin-x64
          - target: linux-x64
            runner: ubuntu-latest
            output: packages/native/npm/linux-x64
            zig: true
          - target: linux-x64-musl
            runner: ubuntu-latest
            output: packages/native/npm/linux-x64/musl
            zig: true
          - target: linux-arm64
            runner: ubuntu-latest
            output: packages/native/npm/linux-arm64
            zig: true
          - target: linux-arm64-musl
            runner: ubuntu-latest
            output: packages/native/npm/linux-arm64/musl
            zig: true
          - target: win32-x64
            runner: ubuntu-latest
            output: packages/native/npm/win32-x64
            zig: true
          - target: win32-arm64
            runner: ubuntu-latest
            output: packages/native/npm/win32-arm64
            zig: true

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Set up Zig
        if: matrix.zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.16.0

      - name: Build the core
        working-directory: packages/native
        run: node build.mjs ${{ matrix.target }}

      - name: Upload the binary
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: narsil-native-${{ matrix.target }}
          path: ${{ matrix.output }}/narsil-core.node
          if-no-files-found: error

  lint:
    name: Check the C code with clang-tidy and clang-format
    runs-on: macos-15
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Check every kernel path with clang-tidy and the layout with clang-format
        run: pnpm --filter @delali/narsil-native-build lint

      - name: Check the C language data and Unicode tables match a fresh generation
        run: pnpm --filter @delali/narsil run native-analysis

  sanitised:
    name: Test the core in C under the sanitisers on ${{ matrix.label }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: x86-64
            runner: ubuntu-latest
          - label: 64-bit Arm
            runner: ubuntu-24.04-arm

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Test the core in C
        working-directory: packages/native
        run: node test/run.mjs

  binding-sanitised:
    name: Test the Node binding under the sanitisers
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build the TypeScript package so the tests can start worker threads
        run: pnpm nx run narsil-ts:build:code

      - name: Run the TypeScript tests that load the core against the sanitised binding
        run: pnpm --filter @delali/narsil-native-build test:binding

      - name: Upload the sanitiser reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: narsil-binding-sanitiser-reports
          path: packages/native/build/sanitised/reports
          if-no-files-found: ignore

  fuzz:
    name: Fuzz every entry point that decodes caller or file bytes
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Install clang with the libFuzzer runtime
        run: sudo apt-get update && sudo apt-get install --yes clang-18 libclang-rt-18-dev

      - name: Restore the inputs that earlier fuzzing discovered
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: packages/native/build/fuzz/discovered
          key: native-fuzz-discovered-${{ github.run_id }}
          restore-keys: native-fuzz-discovered-

      - name: Replay every input that once failed
        working-directory: packages/native
        env:
          NARSIL_FUZZ_CC: clang-18
        run: node fuzz/run.mjs --replay

      - name: Fuzz each target for a minute
        working-directory: packages/native
        env:
          NARSIL_FUZZ_CC: clang-18
        run: node fuzz/run.mjs --seconds 60

      - name: Upload the failing inputs and the fuzzer logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: narsil-fuzz-failures
          path: |
            packages/native/build/fuzz/artifacts
            packages/native/build/fuzz/logs
          if-no-files-found: ignore

  identity:
    name: Compare the core with the WebAssembly search on ${{ matrix.label }}
    needs: build
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: linux-x64
            runner: ubuntu-latest
            output: packages/native/npm/linux-x64
          - label: linux-arm64
            runner: ubuntu-24.04-arm
            output: packages/native/npm/linux-arm64
          - label: darwin-arm64
            runner: macos-15
            output: packages/native/npm/darwin-arm64
          - label: darwin-x64
            runner: macos-15-intel
            output: packages/native/npm/darwin-x64
          - label: win32-x64
            runner: windows-latest
            output: packages/native/npm/win32-x64
          - label: win32-arm64
            runner: windows-11-arm
            output: packages/native/npm/win32-arm64

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Download the binary for this runner
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: narsil-native-${{ matrix.label }}
          path: ${{ matrix.output }}

      - name: Compare the core with the WebAssembly search
        working-directory: packages/ts
        env:
          NARSIL_NATIVE_CORE_PATH: ${{ github.workspace }}/${{ matrix.output }}/narsil-core.node
          NARSIL_REQUIRE_NATIVE_CORE: '1'
        run: pnpm run test:native

      - name: Build the core without its AVX2 and POPCNT kernels
        if: matrix.label == 'linux-x64'
        working-directory: packages/native
        run: node build.mjs linux-x64 --host-compiler --sse2-only

      - name: Compare the core without its AVX2 and POPCNT kernels with the WebAssembly search
        if: matrix.label == 'linux-x64'
        working-directory: packages/ts
        env:
          NARSIL_NATIVE_CORE_PATH: ${{ github.workspace }}/${{ matrix.output }}/narsil-core.node
          NARSIL_REQUIRE_NATIVE_CORE: '1'
        run: pnpm run test:native

  identity-musl:
    name: Compare the core with the WebAssembly search on ${{ matrix.target }}
    needs: build
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x64-musl
            runner: ubuntu-latest
            output: packages/native/npm/linux-x64/musl
          - target: linux-arm64-musl
            runner: ubuntu-24.04-arm
            output: packages/native/npm/linux-arm64/musl

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download the musl binary
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: narsil-native-${{ matrix.target }}
          path: ${{ matrix.output }}

      - name: Compare the core with the WebAssembly search inside Alpine
        run: >
          docker run --rm
          --volume "${{ github.workspace }}:/checkout:ro"
          --env COREPACK_ENABLE_DOWNLOAD_PROMPT=0
          --env NARSIL_NATIVE_CORE_PATH=/narsil/${{ matrix.output }}/narsil-core.node
          --env NARSIL_REQUIRE_NATIVE_CORE=1
          node:24-alpine
          sh -c "cp -r /checkout /narsil
          && cd /narsil
          && corepack enable
          && pnpm install --frozen-lockfile --ignore-scripts
          && cd packages/ts
          && pnpm run test:native"
