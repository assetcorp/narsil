name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm nx run narsil-ts:lint

      - name: Lint (certutil)
        run: pnpm nx run narsil-certutil:lint

      - name: Check every language revision covers its analysis
        run: pnpm nx run narsil-ts:revisions

      - name: Check every recorded lookalike past the bar folds
        run: pnpm nx run narsil-ts:lookalikes

      - name: Check the case fold table matches a fresh generation
        run: pnpm nx run narsil-ts:fold-table

      - name: Typecheck (incl. tests)
        run: pnpm nx run narsil-ts:typecheck

      - name: Typecheck (certutil incl. tests)
        run: pnpm nx run narsil-certutil:typecheck

      - name: Build
        run: pnpm nx run narsil-ts:build

      - name: Build (certutil)
        run: pnpm nx run narsil-certutil:build

      - name: Test (certutil)
        run: pnpm nx run narsil-certutil:test

  pull-request-tests:
    name: Pull request tests
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      etcd:
        image: gcr.io/etcd-development/etcd:v3.6.0
        entrypoint: /usr/local/bin/etcd
        command: >-
          --name node1
          --data-dir /etcd-data
          --listen-client-urls http://0.0.0.0:2379
          --advertise-client-urls http://127.0.0.1:2379
          --listen-peer-urls http://0.0.0.0:2380
          --initial-advertise-peer-urls http://127.0.0.1:2380
          --initial-cluster node1=http://127.0.0.1:2380
        ports:
          - 2379:2379

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build the code that worker tests load
        run: pnpm nx run narsil-ts:build:code

      - name: Test the files outside the after-merge list
        run: pnpm nx run narsil-ts:test:pull-request

      - name: Test (etcd integration)
        env:
          NARSIL_ETCD_ENDPOINT: http://127.0.0.1:2379
        run: pnpm nx run narsil-ts:test:etcd

  full-suite:
    name: Full suite
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      etcd:
        image: gcr.io/etcd-development/etcd:v3.6.0
        entrypoint: /usr/local/bin/etcd
        command: >-
          --name node1
          --data-dir /etcd-data
          --listen-client-urls http://0.0.0.0:2379
          --advertise-client-urls http://127.0.0.1:2379
          --listen-peer-urls http://0.0.0.0:2380
          --initial-advertise-peer-urls http://127.0.0.1:2380
          --initial-cluster node1=http://127.0.0.1:2380
        ports:
          - 2379:2379

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build the code that worker tests load
        run: pnpm nx run narsil-ts:build:code

      - name: Test
        run: pnpm nx run narsil-ts:test

      - name: Test (etcd integration)
        env:
          NARSIL_ETCD_ENDPOINT: http://127.0.0.1:2379
        run: pnpm nx run narsil-ts:test:etcd

      - name: Test (frozen removals under a container memory limit)
        run: pnpm nx run narsil-ts:test:container-memory

      - name: Test (cluster node processes on etcd)
        env:
          NARSIL_ETCD_ENDPOINT: http://127.0.0.1:2379
        run: pnpm nx run narsil-ts:test:cluster

  benchmarks-harness-tests:
    name: Benchmark harness tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install the harness
        working-directory: benchmarks/server
        run: python3 -m pip install -e '.[dev]'

      - name: Run harness tests
        working-directory: benchmarks/server
        run: python3 -m pytest -q

  benchmarks-dataset-artifacts:
    name: Dataset artifacts match their pinned digests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install the harness
        working-directory: benchmarks/server
        run: python3 -m pip install -e .

      - name: Fetch every pinned manifest from its release and compare the digests
        working-directory: benchmarks/server
        run: python3 -m ir_bench.verify_artifacts

  benchmarks-writeup:
    name: Benchmark writeup up to date
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install the chart renderer
        run: python3 -m pip install 'matplotlib==3.10.7'

      - name: Check BENCHMARKS.md and its figures match the latest recorded runs
        run: python3 benchmarks/writeup/generate.py --check
