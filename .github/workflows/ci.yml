name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  SEGMENT_DOWNLOAD_TIMEOUT_MINS: 2

concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: true

jobs:
  changes:
    name: Changed areas
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      typescript: ${{ steps.areas.outputs.typescript }}
      check: ${{ steps.areas.outputs.check }}
      conformance: ${{ steps.areas.outputs.conformance }}
      benchmark_harness: ${{ steps.areas.outputs.benchmark_harness }}
      rust: ${{ steps.areas.outputs.rust }}
      python_engine: ${{ steps.areas.outputs.python_engine }}
      go_engine: ${{ steps.areas.outputs.go_engine }}
      native_core: ${{ steps.areas.outputs.native_core }}
      clients: ${{ steps.areas.outputs.clients }}
      cluster: ${{ steps.areas.outputs.cluster }}
      vector_recall: ${{ steps.areas.outputs.vector_recall }}
      engine: ${{ steps.areas.outputs.engine }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2

      - name: List the areas that this change touches
        id: areas
        env:
          PUSH_BEFORE: ${{ github.event.before }}
          WORKFLOW_FILE: .github/workflows/ci.yml
        run: node .github/scripts/changed-areas.js

  engine:
    name: Engine
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.engine == 'true') }}
    uses: ./.github/workflows/engine.yml

  check:
    name: Check
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.check == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: packages/go/go.mod
          cache: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm nx run narsil-ts:lint

      - name: Lint (certutil)
        run: pnpm nx run narsil-certutil:lint

      - name: Check every language revision covers its analysis
        run: pnpm nx run narsil-ts:revisions

      - name: Check every recorded lookalike past the bar folds
        run: pnpm nx run narsil-ts:lookalikes

      - name: Check the case fold table matches a fresh generation
        run: pnpm nx run narsil-ts:fold-table

      - name: Check the OpenAPI file matches a fresh generation
        run: pnpm nx run narsil-ts:openapi

      - name: Check the Python client matches a fresh generation from the OpenAPI file
        run: pnpm nx run narsil-python:generate

      - name: Check the Go client matches a fresh generation from the OpenAPI file
        run: pnpm nx run narsil-go:generate

      - name: Lint the OpenAPI file
        run: pnpm nx run narsil-ts:openapi:lint

      - name: Typecheck (incl. tests)
        run: pnpm nx run narsil-ts:typecheck

      - name: Typecheck (certutil incl. tests)
        run: pnpm nx run narsil-certutil:typecheck

      - name: Build
        run: pnpm nx run narsil-ts:build

      - name: Build (certutil)
        run: pnpm nx run narsil-certutil:build

      - name: Test (certutil)
        run: pnpm nx run narsil-certutil:test

  tests:
    name: Tests ${{ matrix.shard }} of 4
    needs: [changes, engine]
    if: ${{ !cancelled() && github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      SUITE_NEEDED: ${{ needs.changes.result != 'success' || needs.changes.outputs.typescript == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    services:
      etcd:
        image: ${{ (needs.changes.result != 'success' || needs.changes.outputs.typescript == 'true') && 'gcr.io/etcd-development/etcd:v3.6.0' || '' }}
        entrypoint: /usr/local/bin/etcd
        command: >-
          --name node1
          --data-dir /etcd-data
          --listen-client-urls http://0.0.0.0:2379
          --advertise-client-urls http://127.0.0.1:2379
          --listen-peer-urls http://0.0.0.0:2380
          --initial-advertise-peer-urls http://127.0.0.1:2380
          --initial-cluster node1=http://127.0.0.1:2380
        ports:
          - 2379:2379

    steps:
      - name: Require the shared engine when an affected suite needs it
        if: needs.engine.result != 'success' && (needs.changes.result != 'success' || needs.changes.outputs.engine == 'true')
        run: |
          echo "::error::The shared engine did not finish successfully."
          exit 1

      - name: Report that this change touches no TypeScript test input
        if: env.SUITE_NEEDED != 'true'
        run: echo "This change touches only files outside the TypeScript suite, so the suite does not run."

      - name: Checkout
        if: env.SUITE_NEEDED == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        if: env.SUITE_NEEDED == 'true'
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        if: env.SUITE_NEEDED == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        if: env.SUITE_NEEDED == 'true'
        run: pnpm install --frozen-lockfile

      - name: Download the code that worker tests load
        if: env.SUITE_NEEDED == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: narsil-ts-dist
          path: packages/ts/dist

      - name: Test
        if: env.SUITE_NEEDED == 'true'
        run: pnpm nx run narsil-ts:test --shard=${{ matrix.shard }}/4

      - name: Test (etcd integration)
        if: env.SUITE_NEEDED == 'true' && matrix.shard == 1
        env:
          NARSIL_ETCD_ENDPOINT: http://127.0.0.1:2379
        run: pnpm nx run narsil-ts:test:etcd

      - name: Upload the snapshot behind any missed vector search
        if: failure() && env.SUITE_NEEDED == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: vector-misses-shard-${{ matrix.shard }}
          path: packages/ts/test-evidence/vector-misses/
          if-no-files-found: ignore
          retention-days: 14

  conformance:
    name: Conformance suite
    needs: [changes, engine]
    if: ${{ !cancelled() && needs.engine.result == 'success' && (needs.changes.result != 'success' || needs.changes.outputs.conformance == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download the conformance dataset
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: conformance-dataset
          path: packages/conformance/.dataset

      - name: Lint
        run: pnpm nx run narsil-conformance:lint

      - name: Typecheck (incl. tests)
        run: pnpm nx run narsil-conformance:typecheck

      - name: Build
        run: pnpm nx run narsil-conformance:build

      - name: Install the text search oracle
        working-directory: packages/conformance
        run: pnpm run oracle:install

      - name: Check every committed text search against the oracle
        working-directory: packages/conformance
        run: pnpm run oracle:check

      - name: Test
        run: pnpm nx run narsil-conformance:test

  openapi-clients:
    name: Generated OpenAPI clients
    needs: [changes, engine]
    if: ${{ !cancelled() && github.event_name == 'pull_request' && needs.engine.result == 'success' && (needs.changes.result != 'success' || needs.changes.outputs.typescript == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download the code that worker tests load
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: narsil-ts-dist
          path: packages/ts/dist

      - name: Generate Python and Go clients and search a live server with each
        run: pnpm nx run narsil-ts:test:openapi-clients

  full-suite:
    name: Full suite
    needs: [changes, engine]
    if: ${{ !cancelled() && github.event_name == 'push' && needs.engine.result == 'success' && (needs.changes.result != 'success' || needs.changes.outputs.typescript == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      etcd:
        image: gcr.io/etcd-development/etcd:v3.6.0
        entrypoint: /usr/local/bin/etcd
        command: >-
          --name node1
          --data-dir /etcd-data
          --listen-client-urls http://0.0.0.0:2379
          --advertise-client-urls http://127.0.0.1:2379
          --listen-peer-urls http://0.0.0.0:2380
          --initial-advertise-peer-urls http://127.0.0.1:2380
          --initial-cluster node1=http://127.0.0.1:2380
        ports:
          - 2379:2379

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download the code that worker tests load
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: narsil-ts-dist
          path: packages/ts/dist

      - name: Test
        run: pnpm nx run narsil-ts:test

      - name: Test (etcd integration)
        env:
          NARSIL_ETCD_ENDPOINT: http://127.0.0.1:2379
        run: pnpm nx run narsil-ts:test:etcd

      - name: Test (frozen removals under a container memory limit)
        run: pnpm nx run narsil-ts:test:container-memory

      - name: Test (cluster node processes on etcd)
        env:
          NARSIL_ETCD_ENDPOINT: http://127.0.0.1:2379
        run: pnpm nx run narsil-ts:test:cluster

  benchmarks-harness:
    name: Benchmark harness tests and pinned dataset digests
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.benchmark_harness == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install the harness
        working-directory: benchmarks/server
        run: python3 -m pip install -e '.[dev]'

      - name: Run harness tests
        working-directory: benchmarks/server
        run: python3 -m pytest -q

      - name: Fetch every pinned manifest from its release and compare the digests
        if: ${{ !cancelled() }}
        working-directory: benchmarks/server
        run: python3 -m ir_bench.verify_artifacts

  cluster:
    name: Cluster Tests (${{ matrix.suite }})
    needs: [changes, engine]
    if: ${{ !cancelled() && github.event_name == 'pull_request' && needs.engine.result == 'success' && (needs.changes.result != 'success' || needs.changes.outputs.cluster == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        suite: [node processes on etcd, recovery under injected faults]
    services:
      etcd:
        image: ${{ matrix.suite == 'node processes on etcd' && 'gcr.io/etcd-development/etcd:v3.6.0' || '' }}
        entrypoint: /usr/local/bin/etcd
        command: >-
          --name node1
          --data-dir /etcd-data
          --listen-client-urls http://0.0.0.0:2379
          --advertise-client-urls http://127.0.0.1:2379
          --listen-peer-urls http://0.0.0.0:2380
          --initial-advertise-peer-urls http://127.0.0.1:2380
          --initial-cluster node1=http://127.0.0.1:2380
        ports:
          - 2379:2379

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download the code that the cluster nodes load
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: narsil-ts-dist
          path: packages/ts/dist

      - name: Test (cluster node processes on etcd)
        if: matrix.suite == 'node processes on etcd'
        env:
          NARSIL_ETCD_ENDPOINT: http://127.0.0.1:2379
        run: pnpm nx run narsil-ts:test:cluster

      - name: Test (cluster recovery under injected faults)
        if: matrix.suite == 'recovery under injected faults'
        run: pnpm nx run narsil-ts:test:faults

  vector-recall:
    name: Vector Recall Tests
    needs: [changes, engine]
    if: ${{ !cancelled() && needs.engine.result == 'success' && (needs.changes.result != 'success' || needs.changes.outputs.vector_recall == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download the code that the recall tests load
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: narsil-ts-dist
          path: packages/ts/dist

      - name: Run vector recall tests
        run: pnpm nx run narsil-ts:test:recall
        timeout-minutes: 10

  rust:
    name: Rust crate
    needs: [changes, engine]
    if: ${{ !cancelled() && needs.engine.result == 'success' && (needs.changes.result != 'success' || needs.changes.outputs.rust == 'true') }}
    uses: ./.github/workflows/rust.yml

  go-engine:
    name: Go engine
    needs: [changes, engine]
    if: ${{ !cancelled() && needs.engine.result == 'success' && (needs.changes.result != 'success' || needs.changes.outputs.go_engine == 'true') }}
    uses: ./.github/workflows/go-engine.yml

  python-engine:
    name: Python package
    needs: [changes, engine]
    if: ${{ !cancelled() && needs.engine.result == 'success' && (needs.changes.result != 'success' || needs.changes.outputs.python_engine == 'true') }}
    uses: ./.github/workflows/python-engine.yml

  native-core:
    name: Native search core
    needs: [changes, engine]
    if: ${{ !cancelled() && needs.engine.result == 'success' && (needs.changes.result != 'success' || needs.changes.outputs.native_core == 'true') }}
    uses: ./.github/workflows/native-core.yml

  clients:
    name: Clients
    needs: [changes, engine]
    if: ${{ !cancelled() && needs.engine.result == 'success' && (needs.changes.result != 'success' || needs.changes.outputs.clients == 'true') }}
    uses: ./.github/workflows/clients.yml

  benchmarks-writeup:
    name: Benchmark writeup up to date
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install the chart renderer
        run: python3 -m pip install 'matplotlib==3.10.7'

      - name: Check BENCHMARKS.md and its figures match the latest recorded runs
        run: python3 benchmarks/writeup/generate.py --check
