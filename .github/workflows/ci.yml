name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    services:
      etcd:
        image: gcr.io/etcd-development/etcd:v3.6.0
        entrypoint: /usr/local/bin/etcd
        command: >-
          --name node1
          --data-dir /etcd-data
          --listen-client-urls http://0.0.0.0:2379
          --advertise-client-urls http://127.0.0.1:2379
          --listen-peer-urls http://0.0.0.0:2380
          --initial-advertise-peer-urls http://127.0.0.1:2380
          --initial-cluster node1=http://127.0.0.1:2380
        ports:
          - 2379:2379
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24]

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm nx run narsil-ts:lint

      - name: Lint (certutil)
        run: pnpm nx run narsil-certutil:lint

      - name: Typecheck (incl. tests)
        run: pnpm nx run narsil-ts:typecheck

      - name: Typecheck (certutil incl. tests)
        run: pnpm nx run narsil-certutil:typecheck

      - name: Build
        run: pnpm nx run narsil-ts:build

      - name: Build (certutil)
        run: pnpm nx run narsil-certutil:build

      - name: Test
        run: pnpm nx run narsil-ts:test

      - name: Test (certutil)
        run: pnpm nx run narsil-certutil:test

      - name: Test (etcd integration)
        env:
          NARSIL_ETCD_ENDPOINT: http://127.0.0.1:2379
        run: pnpm nx run narsil-ts:test:etcd

  benchmarks-writeup:
    name: Benchmark writeup up to date
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Check BENCHMARKS.md matches the latest recorded runs
        run: python3 benchmarks/writeup/generate.py --check
